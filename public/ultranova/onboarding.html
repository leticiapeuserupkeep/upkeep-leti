<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ultranova Welcome</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>/* theme before paint: light by default (matches UpKeep), dark if chosen before */
  try { if (localStorage.getItem('ultranova.theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ultranova.css">
<style>
  /* Welcome: one screen that plays as a short sequence, then hands over to the workspace.
       1 "Welcome to Ultranova" + a line about the assistant; then, under it (nothing is removed),
         "Let's get started. Want me to…" and the four options (wow.js) one under another, then the message box.
       2 Picking an option (or sending your own message) slides the welcome to the left and opens home, where the request
         is the user's first message, the assistant introduces itself and picks the task up (see home.html).
     Motion: every piece enters with a fade + 10px rise over 350ms; the options follow each other every 135ms.
     Light by default (white, soft lilac glow, black buttons, Outfit); the dark look stays behind the toggle. */
  :root { --bg: #f4f4f6; --ink: var(--un-text); --ink-soft: var(--un-text-soft); --in: 350ms; }
  :root[data-theme="dark"] { --bg: #030108; color-scheme: dark; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background-color 0.6s var(--ease); }

  /* ---------- atmosphere: the same soft glow as home, at 30%, drifting slowly ---------- */
  .bgimg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bgimg i { position: absolute; inset: -8%; display: block; animation: float 18s ease-in-out infinite; will-change: transform; transition: opacity 0.8s var(--ease); }
  .bgimg .light { background: url("home-bg-light-soft.webp") 0 100% / cover no-repeat; opacity: 0.3; }
  .bgimg .dark { background: url("bg-ribbons.png") center bottom / cover no-repeat; opacity: 0; }
  :root[data-theme="dark"] .bgimg .light { opacity: 0; }
  :root[data-theme="dark"] .bgimg .dark { opacity: 1; }
  :root[data-theme="dark"] .bgimg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 56% 58% at 50% 50%, rgba(3, 1, 8, 0.78), rgba(3, 1, 8, 0.4) 60%, rgba(3, 1, 8, 0) 85%); }
  @keyframes float { 0%, 100% { transform: translate3d(0, 0, 0) scale(1); } 33% { transform: translate3d(3%, -2%, 0) scale(1.04); } 66% { transform: translate3d(-2%, 2%, 0) scale(1.02); } }

  /* ---------- frame ---------- */
  .app { position: relative; z-index: 10; min-height: 100dvh; display: flex; flex-direction: column; padding-block: 20px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top { width: 100%; max-width: 1160px; margin-inline: auto; display: flex; align-items: center; justify-content: space-between; }
  .un-brand { color: var(--ink); }
  .stage { flex: 1; display: grid; place-items: center; padding-block: 16px; min-width: 0; }
  .welcome { width: min(100%, 600px); display: flex; flex-direction: column; align-items: center; text-align: center; }

  /* leaving for the workspace: the welcome slides out to the left */
  .welcome, .top { transition: transform 0.45s cubic-bezier(0.4, 0, 1, 1), opacity 0.35s ease; }
  body.leaving .welcome { transform: translateX(-72px); opacity: 0; }
  body.leaving .top { opacity: 0; }

  /* ---------- the sequence: pieces stay hidden until the script reveals them (.in) ---------- */
  .seq { opacity: 0; transform: translateY(10px); transition: opacity var(--in) ease, transform var(--in) var(--ease); }
  .seq.in { opacity: 1; transform: none; }

  /* the title just fades in (no shine or unveil); then the lines are written */
  .title h1 { opacity: 0; transform: translateY(10px); transition: opacity 0.6s ease, transform 0.6s var(--ease); }
  .title h1.in { opacity: 1; transform: none; }

  /* lines are written word by word (each word fades in, unblurring) and then stay */
  .write .w { display: inline-block; opacity: 0; filter: blur(4px); transform: translateY(6px); transition: opacity 0.55s ease, filter 0.55s ease, transform 0.55s var(--ease); transition-delay: var(--d, 0ms); }
  .write.in .w { opacity: 1; filter: none; transform: none; }

  h1 { font-family: var(--font-display); font-weight: 300; font-size: clamp(36px, 6.4vw, 60px); line-height: 1.06; letter-spacing: -0.03em; margin: 0; text-wrap: balance; }
  h1 .hl { background: linear-gradient(100deg, #ec4899 0%, #d946ef 45%, #7c3aed 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }   /* pink → purple */
  :root[data-theme="dark"] h1 .hl { background-image: linear-gradient(100deg, #f9a8d4, #f0abfc 45%, #c4b5fd); }

  /* the lines under the title: each one appears under the last and stays, so it all reads as written */
  .swap { display: flex; flex-direction: column; gap: 6px; width: 100%; margin-top: 16px; }
  /* the first line reads as one line on wider screens: it may run wider than the 600px column */
  @media (min-width: 760px) { .swap { width: max-content; max-width: calc(100vw - 48px); } #line1 { white-space: nowrap; } }
  .swap > p { margin: 0; font-size: 17px; line-height: 1.5; color: var(--ink-soft); text-wrap: balance; }
  .swap > .ask-line { color: var(--ink); padding-top: 16px; }

  /* ---------- the four options, one under another ---------- */
  .options { list-style: none; width: 100%; margin: 28px 0 0; padding: 0; display: grid; gap: 8px; }
  .option { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 16px 12px 12px; border: 1px solid var(--un-paper-line); border-radius: 16px; background: var(--un-paper); color: var(--ink);
    font: 400 15px/20px var(--font-display); text-align: left; cursor: pointer; transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), border-color 0.25s, background 0.25s; }
  .option .un-wow__icon { width: 36px; height: 36px; border-radius: 10px; flex: none; }
  .option .t { flex: 1; min-width: 0; }
  .option .go { width: 16px; height: 16px; flex: none; color: var(--ink-soft); transition: transform 0.3s var(--ease), color 0.2s; }
  /* hover: no shadow — a halo of light runs around the border, and passes again every few seconds
     (same glint as the Ultranova card in the CMS sidebar) */
  .option::before {
    content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none; opacity: 0;
    background: linear-gradient(110deg, transparent 18%, #d946ef 36%, #ffffff 50%, #a78bfa 64%, transparent 82%) 88% 0 / 300% 100% no-repeat;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    transition: opacity 0.3s ease;
  }
  .option:hover::before { opacity: 1; animation: option-glint 3.2s linear infinite; }
  @keyframes option-glint {
    0%   { background-position: 88% 0; animation-timing-function: cubic-bezier(0.3, 0, 0.7, 1); }
    40%  { background-position: 12% 0; }
    100% { background-position: 12% 0; }
  }
  .option:hover { border-color: color-mix(in srgb, #a78bfa 35%, transparent); }
  .option:hover .go { color: var(--ink); transform: translate(2px, -2px); }
  .option:active { transform: scale(0.99); }
  @media (prefers-reduced-motion: reduce) { .option:hover::before { animation: none; background-position: 50% 0; } }
  .option:focus-visible { outline: 2px solid #7c3aed; outline-offset: 3px; }
  .option.picked { border-color: var(--ink); }
  :root[data-theme="light"] .option { background: rgba(255, 255, 255, 0.78); border-color: rgba(255, 255, 255, 0.95); -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2); }
  :root[data-theme="light"] .option:hover { background: #fff; }

  /* ---------- message box ---------- */
  .ask { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 16px; padding: 8px 8px 8px 18px; border: 1px solid var(--un-paper-line); border-radius: 18px; background: var(--un-paper); transition: border-color 0.2s, box-shadow 0.3s, opacity var(--in) ease, transform var(--in) var(--ease); }
  :root[data-theme="light"] .ask { background: #fff; box-shadow: 0 18px 40px -26px rgba(21, 19, 28, 0.3); }
  .ask:focus-within { border-color: color-mix(in srgb, var(--un-text) 30%, transparent); }
  .ask input { flex: 1; min-width: 0; height: 36px; border: 0; outline: 0; background: transparent; color: var(--ink); font: 400 15px var(--font-display); }
  .ask input::placeholder { color: var(--ink-soft); opacity: 0.8; }
  .send { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--un-tile); color: var(--ink-soft); cursor: pointer; transition: background 0.2s, color 0.2s, transform 0.2s var(--ease); }
  .send .un-icon { width: 18px; height: 18px; }
  .send.ready { background: #15131c; color: #fff; }
  :root[data-theme="dark"] .send.ready { background: #fff; color: #15131c; }
  .send.ready:hover { transform: translateY(-1px); }
  .send:focus-visible { outline: 2px solid #7c3aed; outline-offset: 2px; }

  /* ---------- new UI (Figma "new ui" › onboarding): warm off-white page, black type, olive → yellow accent ---------- */
  .top-right { display: flex; align-items: center; gap: 16px; }
  .top-right .divider { width: 1px; height: 39px; background: #e0e0dc; }
  .cms-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 24px; background: #e8e8e5; color: #1a1a1a; font: 400 14px/20px var(--font-display); text-decoration: none; transition: background 0.2s; }
  .cms-pill:hover { background: #deded9; }
  .un-brand .mark { width: 26px; height: 26px; flex: none; }
  .un-brand .word { font: 600 20px/normal var(--font-display); letter-spacing: 0; }
  :root[data-theme="dark"] .un-brand .mark { filter: invert(1); }
  :root[data-theme="dark"] .top-right .divider { background: rgba(255, 255, 255, 0.14); }
  :root[data-theme="dark"] .cms-pill { background: rgba(255, 255, 255, 0.08); color: #fff; }
  :root[data-theme="dark"] .cms-pill:hover { background: rgba(255, 255, 255, 0.14); }
  :root[data-theme="light"] { --bg: #f7f7f5; --ink: #1a1a1a; }
  :root[data-theme="light"] .bgimg .light { opacity: 0; }
  :root[data-theme="light"] .app { padding: 12px; }
  :root[data-theme="light"] .top { max-width: none; padding-right: 16px; }
  :root[data-theme="light"] .un-brand { padding: 20px 12px; }
  :root[data-theme="light"] .un-brand .word { background: linear-gradient(90deg, #1a1a1a 0%, #5a5a18 39.3%, #c3c300 94.5%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  :root[data-theme="light"] .un-toggle__label { font-size: 12px; }
  :root[data-theme="light"] h1 { color: #1a1a1a; letter-spacing: -1.8px; }
  :root[data-theme="light"] h1 .hl { background-image: linear-gradient(90deg, #1a1a1a 0%, #5a5a18 38%, #a3a30a 70%, #c3c300 100%); }   /* the olive spreads over more of the word */
    :root[data-theme="light"] .swap { margin-top: 12px; gap: 40px; }
  :root[data-theme="light"] .swap > p { color: #1a1a1a; }
  :root[data-theme="light"] .swap > .ask-line { padding-top: 0; font-weight: 600; }
  :root[data-theme="light"] .options { margin-top: 40px; }
  :root[data-theme="light"] .option { color: #1a1a1a; }
  :root[data-theme="light"] .option .un-wow__icon { background: #f7f7f5; color: #1a1a1a; }
  :root[data-theme="light"] .option::before { background-image: linear-gradient(110deg, transparent 18%, #c3c300 36%, #ffffff 50%, #8a8a2e 64%, transparent 82%); }
  :root[data-theme="light"] .option:hover { border-color: color-mix(in srgb, #c3c300 35%, transparent); }
  :root[data-theme="light"] .option:focus-visible, :root[data-theme="light"] .send:focus-visible { outline-color: #1a1a1a; }
  :root[data-theme="light"] .ask { margin-top: 56px; height: 52px; padding: 8px 8px 8px 20px; border-color: #e5eacc; border-radius: 16px; box-shadow: none; }
  :root[data-theme="light"] .ask:focus-within { border-color: #c9d08f; }
  :root[data-theme="light"] .ask input::placeholder { color: #9f9f99; opacity: 1; }
  :root[data-theme="light"] .send { background: #e8e8e5; color: #1a1a1a; }
  :root[data-theme="light"] .send .un-icon { width: 16px; height: 16px; }
  :root[data-theme="light"] .send.ready { background: #1a1a1a; color: #fff; }
  @media (max-width: 640px) {
    .top-right .divider, .cms-pill { display: none; }
    .swap > p { font-size: 16px; }
    .options { margin-top: 22px; }
    .option { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .seq, .welcome, .top, .ask, .write .w { transition: none !important; } .bgimg i { animation: none; }
    .title h1 { transition: none; }
  }
</style>
</head>
<body>
<div class="bgimg" aria-hidden="true"><i class="light"></i><i class="dark"></i></div>
<div class="un-glow" aria-hidden="true"><i class="a"></i><i class="b"></i></div>

<div class="app">
  <header class="top">
    <div class="un-brand">
      <img class="mark" src="assets/logo-mark.svg" width="26" height="26" alt="">
      <span class="word">Ultranova</span>
    </div>
    <div class="top-right">
      <button class="un-toggle un-toggle--sm" type="button" id="theme" role="switch" aria-checked="false" aria-label="Dark mode"><span class="un-toggle__track"></span><span class="un-toggle__label">Dark Mode</span></button>
      <span class="divider" aria-hidden="true"></span>
      <a class="cms-pill" href="/work-orders"><img src="assets/cms-icon.svg" width="20" height="20" alt="">Go Back to CMS</a>
    </div>
  </header>

  <main class="stage">
    <section class="welcome" aria-labelledby="h0">
      <div class="title"><h1 id="h0">Welcome to <span class="hl">Ultranova</span></h1></div>
      <div class="swap" aria-live="polite">
        <p class="write" id="line1">Your personal assistant, quietly working in the background and reaching out when you’re needed.</p>
        <p class="write ask-line" id="line2">Let’s get started with some tasks...</p>
      </div>
      <ul class="options" id="options" aria-labelledby="line2"></ul>
      <form class="ask seq" id="ask" autocomplete="off">
        <input id="askInput" type="text" placeholder="Or tell me what you have in mind…" aria-label="Or tell me what you have in mind">
        <button class="send" id="send" type="submit" aria-label="Send"><svg class="un-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </form>
    </section>
  </main>
</div>

<script src="wow.js"></script>
<script>
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches, root = document.documentElement;

  /* theme (shared choice with home) */
  var themeBtn = document.getElementById('theme');
  function setTheme(dark) {
    root.setAttribute('data-theme', dark ? 'dark' : 'light'); themeBtn.setAttribute('aria-checked', String(dark));
    try { localStorage.setItem('ultranova.theme', dark ? 'dark' : 'light'); } catch (e) {}
  }
  themeBtn.addEventListener('click', function () { setTheme(themeBtn.getAttribute('aria-checked') !== 'true'); });
  setTheme(root.getAttribute('data-theme') === 'dark');

  /* the four options, as questions ("Want me to… brief you every morning…?") */
  var list = document.getElementById('options');
  list.innerHTML = UltranovaWow.list.map(function (w) {
    return '<li class="seq"><button type="button" class="option" data-wow="' + w.key + '"><span class="un-wow__icon">' + UltranovaWow.icon(w.icon) + '</span>'
      + '<span class="t">' + w.option + '</span>' + UltranovaWow.icon('go', 'go') + '</button></li>';
  }).join('');

  /* ---------- the sequence ----------
     one line at a time, and everything stays: the title fades in → the first line is
     written word by word → "Let's get started. Want me to…" written under it → the four options, 135ms apart → the message box as soon as the last one is in. */
  var $ = function (id) { return document.getElementById(id); };
  function show(el) { el.hidden = false; void el.offsetWidth; el.classList.add('in'); }
  var items = [].slice.call(list.children);
  function at(ms, fn) { setTimeout(fn, ms); }
  /* split a line into words so it can be written one word at a time; returns how long it takes */
  function words(el) {
    var parts = el.textContent.trim().split(/\s+/);
    el.setAttribute('aria-label', el.textContent.trim());
    el.innerHTML = parts.map(function (w, i) { return '<span class="w" aria-hidden="true" style="--d:' + (i * 75) + 'ms">' + w + '</span>'; }).join(' ');
    return parts.length * 75 + 550;
  }
  var line1Ms = words($('line1')), line2Ms = words($('line2'));
  if (reduce) {
    show($('h0')); show($('line1')); show($('line2')); items.forEach(show); show($('ask'));
  } else {
    // the title fades in first; only then are the lines written, one after the other
    var t1 = 1150, t2 = t1 + line1Ms + 500, t3 = t2 + line2Ms + 150;
    at(150, function () { show($('h0')); });
    at(t1, function () { show($('line1')); });
    at(t2, function () { show($('line2')); });
    items.forEach(function (li, i) { at(t3 + i * 135, function () { show(li); }); });
    at(t3 + items.length * 135 + 250, function () { show($('ask')); });
  }

  /* ---------- message box ---------- */
  var input = $('askInput'), send = $('send');
  input.addEventListener('input', function () { send.classList.toggle('ready', !!input.value.trim()); });

  /* ---------- into the workspace: the welcome slides left, home opens with the request as the first message ---------- */
  var leaving = false;
  function go(run, text) {
    if (leaving) return; leaving = true;
    try {
      sessionStorage.setItem('ultranova.intro', '1');   /* home: the assistant introduces itself first */
      if (text) sessionStorage.setItem('ultranova.ask', text); else sessionStorage.removeItem('ultranova.ask');
    } catch (e) { /* home starts without the intro */ }
    document.body.classList.add('leaving');
    setTimeout(function () { location.href = 'home.html' + (run ? '?run=' + encodeURIComponent(run) : ''); }, reduce ? 0 : 420);
  }
  list.addEventListener('click', function (e) {
    var b = e.target.closest('[data-wow]'); if (!b) return;
    b.classList.add('picked'); go(b.getAttribute('data-wow'));
  });
  $('ask').addEventListener('submit', function (e) {
    e.preventDefault(); var t = input.value.trim(); if (!t) { input.focus(); return; }
    var w = UltranovaWow.byPrompt(t); go(w ? w.key : null, w ? null : t);
  });
})();
</script>
</body>
</html>

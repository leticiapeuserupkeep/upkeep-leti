<title>Ultranova Onboarding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ultranova.css">
<style>
  /* Layout: still glass-ribbon image behind (floats very slowly), one centered glass card holding three steps
     (Welcome → Select your assistant → What would you like help with), assistant drawn on top (fg canvas).
     Matches the Figma frames 19598:1627. One committed dark look: black, violet and fuchsia glass, a cool cyan accent. */
  :root {
    --bg: #030108;
    --violet: #8b5cf6;
    --fuchsia: #d946ef;
    --cyan: #5eead4;
    --ink: #f5f0ff;
    --ink-soft: #b7abdc;
    --ink-faint: #8678b8;
    --glass: rgba(255, 255, 255, 0.06);
    --glass-strong: rgba(255, 255, 255, 0.1);
    --glass-line: rgba(255, 255, 255, 0.14);
    --card: rgba(22, 3, 44, 0.86);
    --chip-line: #a600ac;
    color-scheme: dark;
  }

  html { background: var(--bg); }
  body {
    min-height: 100dvh; background-color: var(--bg); color: var(--ink);
    font-family: var(--font-body); -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }

  /* ---------- atmosphere ---------- */
  .bgimg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: #000; }
  .bgimg u { position: absolute; inset: 0; display: block; transition: transform 1.6s var(--ease); transform: translate3d(calc(var(--s, 0) * -42px), calc(var(--s, 0) * 18px), 0) scale(calc(1 + var(--s, 0) * 0.04)); }
  .bgimg i {
    position: absolute; inset: -8%; display: block;
    background: url("bg-ribbons.png") center bottom / cover no-repeat; transform: scale(1.04);
    animation: float 14s ease-in-out infinite; will-change: transform;
  }
  /* slow floating: drifts a few tens of pixels in a loop; the wrapper (u) also shifts a little on every step */
  @keyframes float {
    0%, 100% { transform: scale(1.04) translate3d(0, 0, 0) rotate(0deg); }
    25% { transform: scale(1.05) translate3d(-18px, -16px, 0) rotate(0.5deg); }
    50% { transform: scale(1.06) translate3d(0, -28px, 0) rotate(0deg); }
    75% { transform: scale(1.05) translate3d(18px, -14px, 0) rotate(-0.5deg); }
  }
  @media (max-width: 899px) { .bgimg i { background-size: auto 60%; background-position: 70% 100%; } }
  #fg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; display: block; z-index: 20; }

  /* ---------- frame ---------- */
  .app {
    position: relative; z-index: 10; min-height: 100dvh; display: flex; flex-direction: column;
    padding-block: 24px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .top { width: 100%; max-width: 1160px; margin-inline: auto; }
  .stage { flex: 1; display: grid; place-items: center; padding-block: 16px; min-width: 0; }

  /* ---------- card ---------- */
  .card {
    position: relative; width: min(100%, 680px); min-height: 560px; display: flex; flex-direction: column; align-items: center;
    padding: 36px 32px 28px; text-align: center;
  }
  .card.moving { animation: nudge 0.9s var(--ease); }
  @keyframes nudge { 0% { transform: none; } 30% { transform: translateY(6px) scale(0.992); } 100% { transform: none; } }

  /* back button: top-left of the card, only from step 2 on */
  .back { position: absolute; top: 24px; left: 24px; z-index: 2; opacity: 0; pointer-events: none; transform: translateX(6px); transition: opacity 0.4s, transform 0.5s var(--ease), background 0.25s; }
  .card:not([data-step="0"]) .back { opacity: 1; pointer-events: auto; transform: none; }
  .steps { flex: 1; width: 100%; display: grid; align-items: center; min-width: 0; }
  .step { display: none; width: 100%; min-width: 0; flex-direction: column; align-items: center; padding-block: 12px; }
  .step.active { display: flex; animation: stepIn 0.5s ease backwards; }
  .step.out { opacity: 0; transform: translateX(-56px) scale(0.97); transition: opacity 0.28s ease, transform 0.32s cubic-bezier(0.4, 0, 1, 1); }
  @keyframes stepIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- entrance: everything shows up one by one, soft and slow ---------- */
  @keyframes cardIn { from { opacity: 0; transform: translateY(40px) scale(0.965); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .bgimg { animation: fadeIn 1.6s ease both; }
  .card { animation: cardIn 1s var(--ease) 0.25s backwards; }
  .foot { animation: un-rise 0.8s var(--ease) 1.5s backwards; }
  /* each child of the active step rises in turn (--d is set per item below); the topic chips follow one after another */
  .step.active > * { animation: un-rise 0.85s var(--ease) calc(0.75s + var(--n, 0) * 0.14s) backwards; }
  .step.active > :nth-child(1) { --n: 0; } .step.active > :nth-child(2) { --n: 1; } .step.active > :nth-child(3) { --n: 2; }
  .step.active > :nth-child(4) { --n: 3; } .step.active > :nth-child(5) { --n: 4; } .step.active > :nth-child(6) { --n: 5; }
  .step.active .un-chip { animation: un-rise 0.7s var(--ease) calc(1.2s + var(--c, 0) * 0.1s) backwards; }
  .un-chip:nth-child(1) { --c: 0; } .un-chip:nth-child(2) { --c: 1; } .un-chip:nth-child(3) { --c: 2; } .un-chip:nth-child(4) { --c: 3; }
  /* later steps are already on screen, so they start sooner than the very first one */
  body.went .step.active > * { animation-delay: calc(0.15s + var(--n, 0) * 0.12s); }
  body.went .step.active .un-chip { animation-delay: calc(0.6s + var(--c, 0) * 0.09s); }

  /* ---------- type ---------- */
  h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(32px, 6.4vw, 46px); line-height: 1.06; letter-spacing: -0.03em; margin: 0; text-wrap: balance; }
  h1 .hl { background: linear-gradient(90deg, #d8b4fe, #f0abfc 50%, #7dd3fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(19px, 3.4vw, 24px); letter-spacing: -0.01em; margin: 0; }
  .lede { color: var(--ink); font-size: 16px; line-height: 1.5; max-width: 40ch; margin: 0; }
  .soft { color: var(--ink-soft); font-size: 17px; margin: 0; }

  /* ---------- controls ---------- */

  .foot { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 8px; }
  .dots { display: none; /* progress dots hidden for now: use `flex` to show them again */ gap: 8px; align-items: center; margin-bottom: 16px; }
  .dots span { width: 9px; height: 9px; border-radius: 99px; background: rgba(255, 255, 255, 0.28); transition: width 0.4s var(--ease), background 0.4s; }
  .dots span.on { width: 40px; background: linear-gradient(90deg, #8b5cf6, #d946ef); }

  /* ---------- step 1: welcome ---------- */
  .s0 { gap: 24px; }   /* even spacing between the title, tagline, text and button */
  .s0 h1 { margin: 0; font-size: clamp(30px, 8vw, 58px); line-height: 58px; }
  .s0 .lede { padding-bottom: 12px; }

  /* ---------- step 2: select assistant ---------- */
  .s1 h1 { margin-top: 18px; padding-bottom: 20px; font-size: clamp(22px, 4.2vw, 30px); }   /* same size as the step 3 title */
  /* five-up carousel: every assistant sits at an offset from the focused one (-2..2, wrapping); the focused one is large and awake */
  .pick { --w: 190px; position: relative; width: 100%; height: calc(var(--w) * 1.05); margin-top: -30px;  /* tucks under the name pill; the robots are drawn above it */ touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
  .pick.drag { cursor: grabbing; }
  .pick::before { content: ""; position: absolute; left: 50%; top: 50%; width: var(--w); height: var(--w); transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(closest-side, hsla(var(--h, 268), 90%, 62%, 0.4), transparent 72%); filter: blur(6px); transition: background 0.6s; pointer-events: none; }
  .ast { position: absolute; left: 50%; top: 50%; width: var(--w); height: var(--w); margin: calc(var(--w) / -2) 0 0 calc(var(--w) / -2); padding: 0; border: 0; background: none; cursor: inherit;
    transition: transform 0.7s var(--ease), opacity 0.5s; opacity: 0; transform: scale(0.3); pointer-events: none; }
  .ast[data-off="0"]  { transform: none; opacity: 1; pointer-events: auto; z-index: 3; }
  .ast[data-off="1"]  { transform: translateX(calc(var(--w) * 0.82)) scale(0.5); opacity: 0.55; pointer-events: auto; z-index: 2; }
  .ast[data-off="-1"] { transform: translateX(calc(var(--w) * -0.82)) scale(0.5); opacity: 0.55; pointer-events: auto; z-index: 2; }
  .ast[data-off="2"]  { transform: translateX(calc(var(--w) * 1.3)) scale(0.36); opacity: 0.32; pointer-events: auto; z-index: 1; }
  .ast[data-off="-2"] { transform: translateX(calc(var(--w) * -1.3)) scale(0.36); opacity: 0.32; pointer-events: auto; z-index: 1; }
  .ast.jump { transition: none; opacity: 0; }  /* wrapping around: reappear on the far side instead of flying across */
  .ast[data-off="1"]:hover, .ast[data-off="-1"]:hover { opacity: 0.8; }
  .slot { position: absolute; inset: 0; }
  .s1 .un-btn { margin-top: 30px; }

  /* ---------- step 3: what to help with ---------- */
  .s2 .mini { position: relative; width: 92px; height: 92px; margin-top: -4px; }
  .s2 h1 { margin: 16px 0; padding: 24px 0; font-size: clamp(22px, 4.2vw, 30px); }   /* the step 3 title is smaller than the other step titles */
  .s2 .soft { margin-top: 0; }   /* the title's 16px bottom margin is the gap */
  .topics { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 18px; }
  .s2 .un-btn { margin-top: 36px; }
  .name-pill { margin-top: 18px; }
  .hello { margin-top: 6px; }
  .eyebrow { padding: 6px 14px; font-size: 13px; }

  .no-gl .slot { background: radial-gradient(closest-side, rgba(196, 181, 253, 0.9), rgba(139, 92, 246, 0.2) 70%, transparent 72%); border-radius: 50%; margin: 18%; }
  @media (max-width: 560px) { .card { padding: 28px 18px 22px; border-radius: 32px; } .pick { --w: 150px; } .ast[data-off="2"], .ast[data-off="-2"] { opacity: 0; pointer-events: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
</style>

<div class="bgimg" aria-hidden="true"><u><i></i></u></div>

<div class="app">
  <header class="top">
    <div class="un-brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l3.2 9.6L29 14.8l-9.8 3.2L16 29l-3.2-11L3 14.8l9.8-3.2z" fill="#dd00ff"/></svg>
      <span>Ultranova</span>
    </div>
  </header>

  <main class="stage">
    <div class="card un-card" id="card" data-step="0">
      <button class="back un-btn un-btn--icon un-btn--md un-btn--ghost un-btn--white" id="back" type="button" aria-label="Back"><svg class="un-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="dots" id="dots" aria-hidden="true"><span class="on"></span><span></span><span></span></div>
      <span class="eyebrow un-pill un-pill--small"><i class="un-dot"></i><span id="eyebrow">Step 1 of 3</span></span>

      <div class="steps">
        <!-- 1 · welcome -->
        <section class="step s0 active" data-step="0" aria-labelledby="h0">
          <h1 id="h0" tabindex="-1">Welcome to <span class="hl">Ultranova</span></h1>
          <h2>You rest. I’ll keep things moving.</h2>
          <p class="lede">I’ll track updates, follow up on tasks, and notify you when you’re needed. No need to keep the app open.</p>
          <button class="un-btn" id="next0">Let’s Get Started</button>
        </section>

        <!-- 2 · select assistant -->
        <section class="step s1" data-step="1" aria-labelledby="h1">
          <h1 id="h1" tabindex="-1">Select your <span class="hl">Assistant</span></h1>
          <div class="name-pill un-pill" aria-live="polite">Hi, I’m <b id="pname">Core</b></div>
          <div class="pick" id="pick" role="group" aria-label="Assistants. Drag, click or use the arrow keys to rotate">
            <button class="ast" data-i="0" aria-label="Core"><span class="slot" data-robot="a0"></span></button>
            <button class="ast" data-i="1" aria-label="Lumen"><span class="slot" data-robot="a1"></span></button>
            <button class="ast" data-i="2" aria-label="Mesh"><span class="slot" data-robot="a2"></span></button>
            <button class="ast" data-i="3" aria-label="Volt"><span class="slot" data-robot="a3"></span></button>
            <button class="ast" data-i="4" aria-label="Pulse"><span class="slot" data-robot="a4"></span></button>
          </div>
          <button class="un-btn" id="next1">Choose Core</button>
        </section>

        <!-- 3 · what would you like help with -->
        <section class="step s2" data-step="2" aria-labelledby="h2">
          <div class="mini"><span class="slot" data-robot="final"></span></div>
          <div class="hello un-pill un-pill--strong">Nice to meet you, Leti!</div>
          <h1 id="h2" tabindex="-1">What would you like help with?</h1>
          <p class="soft">Select one or more.</p>
          <div class="topics" id="topics" role="group" aria-label="Topics">
            <button class="un-chip un-chip--lg" type="button" aria-pressed="false">Sales &amp; outreach</button>
            <button class="un-chip un-chip--lg" type="button" aria-pressed="false">Projects &amp; tasks</button>
            <button class="un-chip un-chip--lg" type="button" aria-pressed="false">Operations</button>
            <button class="un-chip un-chip--lg" type="button" aria-pressed="false">Productivity</button>
          </div>
          <button class="un-btn" id="finish">Start Now!</button>
        </section>
      </div>

      <div class="foot">
        <button class="un-link" id="skip">Skip</button>
      </div>
    </div>
  </main>
</div>

<canvas id="fg" aria-hidden="true"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="robot.js"></script>
<script>
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var robots = null;
  try {
    robots = UltranovaRobots.init({
      canvas: document.getElementById('fg'), hi: ['a0', 'a1', 'a2', 'a3', 'a4'], greet: ['final'],
      /* only the focused assistant follows the cursor; the dimmed ones in the carousel sleep */
      asleepOf: function (el) { var a = el.closest('.ast'); return !!a && a.getAttribute('data-off') !== '0'; },
      
      opacityOf: function (el) {
        var st = el.closest('.step'); if (!st || !st.classList.contains('active')) return 0;
        var a = el.closest('.ast'); /* carousel items fade by distance from the focus (CSS) */
        return parseFloat(getComputedStyle(st).opacity) * (a ? parseFloat(getComputedStyle(a).opacity) : 1);
      }
    });
  } catch (e) { document.body.classList.add('no-gl'); }

  /* =====================================================================
     Onboarding flow: welcome → select assistant → topics → home.html
     ===================================================================== */
  var ASSISTANTS = ['Core', 'Lumen', 'Mesh', 'Volt', 'Pulse'], HUES = [268, 42, 200, 240, 320];
  var steps = [].slice.call(document.querySelectorAll('.step')), dots = [].slice.call(document.querySelectorAll('#dots span'));
  var state = { step: 0, avatar: 0 }, busy = false;

  function go(n) {
    if (busy || n === state.step) return; busy = true;
    var cur = steps[state.step], nxt = steps[n], card = document.getElementById('card'); cur.classList.add('out');
    card.classList.remove('moving'); void card.offsetWidth; card.classList.add('moving');
    setTimeout(function () {
      document.body.classList.add('went'); card.setAttribute('data-step', n); cur.classList.remove('active', 'out'); nxt.classList.add('active'); state.step = n;
      dots.forEach(function (d, i) { d.classList.toggle('on', i === n); });
      document.body.style.setProperty('--s', n);
      document.getElementById('eyebrow').textContent = 'Step ' + (n + 1) + ' of 3';
      if (n === 2) document.querySelector('[data-robot="final"]').setAttribute('data-variant', state.avatar);   /* the chosen assistant greets you */
      if (n === 1 && robots) setTimeout(function () { robots.wake('a' + state.avatar); }, 120); /* instances exist after the first frame */
      var h = nxt.querySelector('h1'); if (h) h.focus({ preventScroll: true });
      busy = false;
    }, reduce ? 0 : 300);
  }

  /* step 2: five-up carousel. The focused one is the choice; it rotates endlessly and can be dragged, clicked or moved with the arrows. */
  var pickEl = document.getElementById('pick'), asts = [].slice.call(pickEl.querySelectorAll('.ast')), N = ASSISTANTS.length, prevOff = [];
  function layout(first) {
    asts.forEach(function (a, i) {
      var off = ((i - state.avatar + 2 + N * 2) % N) - 2, was = prevOff[i];
      if (!first && was !== undefined && Math.abs(off - was) > 2) { /* wrapped: jump unseen, then fade in at the new place */
        a.classList.add('jump'); a.setAttribute('data-off', off); void a.offsetWidth; a.classList.remove('jump');
      } else a.setAttribute('data-off', off);
      prevOff[i] = off;
    });
  }
  function pick(i, quiet) {
    var next = ((i % N) + N) % N; if (next === state.avatar && !quiet) return;
    state.avatar = next; layout(quiet);
    var name = ASSISTANTS[next];
    document.getElementById('pname').textContent = name;
    document.getElementById('next1').textContent = 'Choose ' + name;
    pickEl.style.setProperty('--h', HUES[next]);
    if (robots && !quiet) robots.wake('a' + next); /* the newly focused assistant wakes up, hops and waves */
  }
  pick(0, true);
  /* drag / swipe: every ~60px moves one place; a click on a side one brings it to the centre */
  var drag = null, moved = false;
  pickEl.addEventListener('pointerdown', function (e) { drag = { x: e.clientX }; moved = false; });
  window.addEventListener('pointermove', function (e) {
    if (!drag) return; var dx = e.clientX - drag.x;
    if (Math.abs(dx) > 60) { moved = true; pickEl.classList.add('drag'); pick(state.avatar + (dx < 0 ? 1 : -1)); drag.x = e.clientX; }
  });
  window.addEventListener('pointerup', function () { drag = null; pickEl.classList.remove('drag'); });
  asts.forEach(function (a) { a.addEventListener('click', function () { if (!moved) pick(+a.getAttribute('data-i')); }); });
  document.addEventListener('keydown', function (e) {
    if (state.step !== 1) return;
    if (e.key === 'ArrowLeft') pick(state.avatar - 1); else if (e.key === 'ArrowRight') pick(state.avatar + 1);
  });

  /* step 3: multi-select topics */
  var topics = [].slice.call(document.querySelectorAll('.un-chip'));
  topics.forEach(function (t) {
    t.addEventListener('click', function () { t.setAttribute('aria-pressed', String(t.getAttribute('aria-pressed') !== 'true')); if (robots) robots.hop('final'); });
  });

  document.getElementById('back').addEventListener('click', function () { go(state.step - 1); });
  document.getElementById('next0').addEventListener('click', function () { go(1); });
  document.getElementById('next1').addEventListener('click', function () { go(2); if (robots) robots.wave('final'); });

  function enter() {
    var help = topics.filter(function (t) { return t.getAttribute('aria-pressed') === 'true'; }).map(function (t) { return t.textContent; });
    try { sessionStorage.setItem('ultranova.assistant', JSON.stringify({ name: ASSISTANTS[state.avatar], avatar: state.avatar, help: help })); } catch (e) { /* storage unavailable: home falls back to defaults */ }
    location.href = 'home.html';
  }
  document.getElementById('finish').addEventListener('click', enter);
  document.getElementById('skip').addEventListener('click', enter);
})();
</script>

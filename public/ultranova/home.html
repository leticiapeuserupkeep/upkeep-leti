<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ultranova</title>
<script>/* theme before paint: light by default (matches UpKeep), dark if chosen before */
  try { if (localStorage.getItem('ultranova.theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  try { if (sessionStorage.getItem('ultranova.intro')) document.documentElement.classList.add('arriving'); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ultranova.css">
<style>
  /* Home (the screen you land on after onboarding): glass sidebar, centered assistant greeting, chat bar.
     Values follow the Figma frame "Nova / Ultranova" (sidebar 260px, Outfit + Inter, #dd00ff accent). */
  :root {
    --bg: #000;
    --brand: #dd00ff;
    --brand-line: #a600ac;
    --sidebar-top: rgba(0, 0, 0, 0.6);         /* the sidebar is 60% opaque over a 16px blur, so the ribbon shows through (Figma) */
    --sidebar-bottom: rgba(87, 10, 158, 0.6);
    --nav-active: #461f5c;
    --dot: #5e016c;
    --dot-live: #00edc5;
    --bar: #1a0b46;
    --ink: #fff;
    --ink-soft: rgba(255, 255, 255, 0.7);
    --sidebar-w: 260px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100dvh; color: var(--ink); font: 400 14px/20px var(--font-body); background: var(--bg); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  button, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  svg { display: block; flex: none; }

  /* glass ribbon (exported from the Figma frame): black everywhere except bottom-left, so it blends into the page */
  .backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: #000; }
  /* the ribbon image sits bottom-left of the content area; its top and right edges fade out so it never shows a cut */
  .backdrop { overflow: hidden; --k: 1; }
  /* background image placed exactly like the Figma frame (CROP fill): the 4096×1229 render is 245.55vw wide, shifted 159.5vw left and anchored to the bottom, so the ribbon sits under the translucent sidebar and rises into the main area */
  .backdrop::before { content: ""; position: absolute; left: calc(-159.5vw * var(--k)); bottom: calc(-15.4vw * var(--k)); width: calc(245.55vw * var(--k)); aspect-ratio: 4096 / 1229; background: url("home-bg-dark.jpg") 0 0 / 100% 100% no-repeat;
    /* the render is not pure black: fade its top and right edges so no rectangle shows */
    -webkit-mask-image: linear-gradient(to top, #000 50%, transparent), linear-gradient(to right, #000 92%, transparent); -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to top, #000 50%, transparent), linear-gradient(to right, #000 92%, transparent); mask-composite: intersect; }

  .app { position: relative; z-index: 1; display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100dvh; }

  /* collapsible sidebar (desktop): it shrinks to a 60px rail of icons; hovering an icon shows a tooltip with its name.
     --sidebar-w follows, so everything positioned from it (backdrop, floating assistant, blurred band) moves with it. */
  .app { transition: grid-template-columns 0.45s var(--ease); }
  .sidebar { width: var(--sidebar-w); transition: width 0.45s var(--ease); }
  .sidebar::before { content: ""; position: absolute; inset: 0; z-index: 0; opacity: 0; pointer-events: none; background: linear-gradient(180deg, rgba(255, 255, 255, var(--side-light-a)), rgba(236, 228, 250, var(--side-light-a))); }   /* light layer, fades in with the theme */
  .sidebar > * { position: relative; z-index: 1; }
  @media (min-width: 861px) {
    :root:has(.app.nav-closed) { --sidebar-w: 60px; }   /* on the root so the backdrop (a sibling of .app) follows too */
    .nav-closed .brand { padding-inline: 0; justify-content: center; }
    .nav-closed .brand-text, .nav-closed .nav-item .grow, .nav-closed .nav-item .chev, .nav-closed .history, .nav-closed .cms .grow, .nav-closed .cms .go { display: none; }
    .nav-closed .nav { overflow: visible; }
    .nav-closed .nav-item { justify-content: center; padding-inline: 0; }
    .nav-closed .cms { margin-inline: 8px; }
    .nav-closed .cms .pane { justify-content: center; padding: 0; }
    .nav-closed .cms .pane.alt .state, .nav-closed .cms .pane.alt .grow { display: none; }
    /* rail footer, top to bottom: Back to CMS (above), expand button, profile avatar at the very bottom */
    .nav-closed .side-foot { flex-direction: column-reverse; justify-content: flex-start; gap: 8px; padding: 12px 0 16px; }
    .nav-closed .foot-right > :not(.nav-close) { display: none; }
  }
  @media (max-width: 860px) { .sidebar .nav-close { display: none; } }   /* the drawer has its own close (scrim / menu button) */
  body:has(.menu-open) #fg { opacity: 0; }   /* the assistant is a canvas above the page: hide it while the drawer is open */
  #fg { transition: opacity 0.3s; }
  .nav-close .un-icon { transition: transform 0.4s var(--ease); }
  .nav-closed .nav-close .un-icon { transform: scaleX(-1); }

  /* ---------- sidebar ---------- */
  .sidebar {
    position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column;
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    --side-light-a: 0.7;
  }
  .sidebar::after { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(180deg, var(--sidebar-top), var(--sidebar-bottom)); }   /* dark layer, fades out in light mode */
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 12px; font: 600 20px/25px var(--font-display); color: #f5f0ff; }
  .brand svg { width: 26px; height: 26px; fill: var(--brand); }
  a.brand { text-decoration: none; border-radius: 8px; transition: opacity 0.2s; }   /* the logo goes back to the welcome (onboarding) */
  a.brand:hover { opacity: 0.75; }
  .nav { display: flex; flex-direction: column; gap: 8px; padding: 12px 8px 0; min-height: 0; overflow-y: auto; }
  .nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 4px; font: 500 14px/20px var(--font-display); text-align: left; transition: background 0.2s var(--ease); }
  .nav-item:hover { background: rgba(255, 255, 255, 0.06); }
  .nav-item.active { background: var(--nav-active); }
  .nav-item .grow { flex: 1; }
  .nav-item .chev { width: 18px; height: 18px; stroke: var(--brand); transition: transform 0.25s var(--ease); }
  .nav-item[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  .history { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.3s var(--ease); }
  .history[hidden] { display: grid; grid-template-rows: 0fr; visibility: hidden; }
  .history > .history-in { min-height: 0; overflow: hidden; }
  .history ul { margin: 0; padding: 0; list-style: none; }
  .chat-item { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; height: 40px; padding: 8px 12px 8px 16px; font: 400 14px/20px var(--font-display); color: var(--ink-soft); text-align: left; border-radius: 4px; transition: color 0.2s, background 0.2s; }
  .chat-item:hover { color: var(--ink); background: rgba(255, 255, 255, 0.05); }
  .chat-item::before { content: ""; width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--dot); transition: background 0.2s; }
  .chat-item.live::before { background: var(--dot-live); }
  .chat-item span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item .more { display: none; width: 24px; height: 24px; border-radius: 4px; align-items: center; justify-content: center; color: var(--ink); }
  .chat-item:hover .more, .chat-item:focus-within .more { display: flex; }
  .chat-item .more svg { width: 16px; height: 16px; fill: currentColor; }
  .chat-item .more { cursor: pointer; transition: background 0.2s; }
  .chat-item .more:hover, .chat-item.menu-open .more { background: rgba(255, 255, 255, 0.12); }
  .chat-item.menu-open .more { display: flex; }
  .chat-item input.rename { flex: 1; min-width: 0; height: 24px; padding: 0 6px; border: 1px solid var(--brand-line); border-radius: 4px; background: rgba(0, 0, 0, 0.35); color: var(--ink); font: 400 14px/20px var(--font-display); outline: 0; }
  .history li { overflow: hidden; transition: max-height 0.4s var(--ease), opacity 0.3s; max-height: 40px; }
  .history li.gone { max-height: 0; opacity: 0; }
  /* chat options submenu: Rename / Archive */

  /* "Back to CMS" banner, at the bottom of the sidebar above the profile row. When the assistant creates something in the CMS it
     swaps to a live status (icon, "WO-1043 created", spinner → check) and returns to the default after a few seconds. */
  .cms { position: relative; margin: auto 16px 0; display: block; height: 44px; border-radius: 8px; overflow: hidden; color: #101113; text-decoration: none;
    background: #fff; border: 1px solid transparent;  /* white, no border (the border only shows green while it's busy) */
    transition: background 0.3s, border-color 0.4s; }
  .cms:hover { background: #f7f7f9; }
  .cms.busy { border-color: #00b894; }
  .cms .pane { position: absolute; inset: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px; font: 500 14px/20px var(--font-display);
    transition: opacity 0.45s var(--ease), transform 0.55s var(--ease); }
  .cms .pane.alt { opacity: 0; transform: translateY(14px); }
  .cms.busy .pane.def { opacity: 0; transform: translateY(-14px); }
  .cms.busy .pane.alt { opacity: 1; transform: none; }
  .cms .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cms .cog { width: 20px; height: 20px; flex: none; fill: none; stroke: #ff5a52; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .cms .go { width: 16px; height: 16px; color: #868e96; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.3s var(--ease); }
  .cms:hover .go { transform: translateX(3px); }
  .cms .kind { width: 20px; height: 20px; flex: none; color: #00a384; }
  .cms .state { position: relative; width: 20px; height: 20px; flex: none; }
  .cms .state svg { position: absolute; inset: 0; width: 20px; height: 20px; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: opacity 0.35s, transform 0.5s var(--ease); }
  .cms .spin { stroke: #868e96; stroke-width: 2; animation: cms-spin 0.9s linear infinite; }
  .cms .tick { stroke: #00a384; stroke-width: 2.4; opacity: 0; transform: scale(0.5); }
  .cms.done .spin { opacity: 0; }
  .cms.done .tick { opacity: 1; transform: none; }
  @keyframes cms-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .cms .spin { animation-duration: 2.4s; } }
  .side-foot { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
  .me:hover { transform: scale(1.06); box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18); }
  .me { cursor: pointer; color: #fff; transition: transform 0.2s var(--ease), box-shadow 0.25s; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #8b5cf6, #d946ef); font: 600 14px/1 var(--font-display); }
  .gear { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: #d9c8ff; transition: background 0.2s; }
  .gear:hover { background: rgba(255, 255, 255, 0.08); }
  .gear .un-icon { width: 20px; height: 20px; }

  /* ---------- main ---------- */
  .main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 100dvh; padding: 32px 60px; gap: 10px; }
  .topbar, .scrim { display: none; }
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 80px; }
  .assistant { width: 176px; height: 176px; margin-bottom: 0; }
  .assistant [data-robot] { width: 100%; height: 100%; }
  .greeting { display: flex; flex-direction: column; align-items: center; gap: 5px; padding-bottom: 29px; }
  .greeting h1 { margin: 0; font: 700 20px/24px var(--font-display); }
  .greeting .role { font: 500 12px/16px var(--font-body); letter-spacing: 0.02em; text-transform: uppercase; }
  .greeting p { margin: 0; max-width: 640px; font: 400 14px/20px var(--font-display); }
  /* the four "wow" starters (wow.js): two by two under the greeting; one tap runs it */
  .wows { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: min(760px, 100%); text-align: left; }   /* one row of four */
  .wows .un-wow { animation: rise 0.7s var(--ease) backwards; animation-delay: calc(0.16s + var(--c, 0) * 0.07s); }
  .wows .un-wow:nth-child(2) { --c: 1; } .wows .un-wow:nth-child(3) { --c: 2; } .wows .un-wow:nth-child(4) { --c: 3; }

  .chatbar { align-self: center; width: min(700px, 100%); display: flex; flex-direction: column; gap: 25px; padding: 20px; border-radius: 8px; background: var(--bar); box-shadow: 0 8px 32px rgba(8, 0, 30, 0.6); border: 1px solid transparent; transition: border-color 0.2s; }
  .chatbar:focus-within { border-color: rgba(221, 0, 255, 0.5); }
  .chatbar textarea { width: 100%; height: 20px; max-height: 160px; resize: none; padding: 0; border: 0; background: transparent; outline: 0; font: 400 14px/20px var(--font-body); }
  .chatbar .field { position: relative; }
  .tabhint { position: absolute; right: 0; top: 0; opacity: 0; transform: translateX(6px); transition: opacity 0.3s, transform 0.4s var(--ease); pointer-events: none; }
  .chatbar.has-suggest .tabhint { opacity: 1; transform: none; }
  .chatbar textarea::placeholder { color: var(--ink); opacity: 0.6; }
  .bar-row { display: flex; align-items: center; justify-content: space-between; height: 24px; }
  .bar-row .right { display: flex; align-items: center; gap: 8px; }

  /* send button turns green once there is something to send */

  /* conversation: the greeting makes way for the thread once something is sent */
  .thread { display: none; flex: 1; min-height: 0; width: min(700px, 100%); align-self: center; flex-direction: column; gap: 14px; overflow-y: auto; padding: 4px 2px 12px; scroll-behavior: smooth; }
  .chatting .thread { display: flex; }
  /* in a conversation the assistant stays fixed and floating at the top of the chat; the thread scrolls under its own space */
  .chatting .stage { flex: 0 0 auto; height: 0; padding-bottom: 0; }
  .chatting .assistant { position: fixed; z-index: 5; top: 12px; left: calc(var(--sidebar-w) + (100vw - var(--sidebar-w)) / 2 - 44px); width: 88px; height: 88px; }
  .main.chatting { height: 100dvh; min-height: 0; padding-top: 0; }
  /* the messages scroll all the way up, under a translucent blurred black band that holds the assistant */
  .chatting .thread { overscroll-behavior: contain; padding-top: 112px; scroll-padding-top: 112px; }
  .main.chatting::before { content: ""; position: fixed; z-index: 4; top: 0; left: var(--sidebar-w); right: 0; height: 108px; pointer-events: none;
    background: rgba(0, 0, 0, 0.4); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    -webkit-mask-image: linear-gradient(#000 72%, transparent); mask-image: linear-gradient(#000 72%, transparent); }
  .chatting .greeting, .chatting .wows { display: none; }
  .wow-text { margin: 12px 0 0; animation: un-msg-in 0.45s var(--ease) backwards; }
  /* arriving from the welcome: the workspace slides in from the right, straight into the conversation */
  html.arriving .greeting, html.arriving .wows { display: none; }
  html.arriving .app { animation: arrive 0.55s var(--ease) both; }
  @keyframes arrive { from { opacity: 0; transform: translateX(56px); } to { opacity: 1; transform: none; } }
  /* the assistant introduces itself in the middle of the chat */
  .meet { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; padding: 4px 0 14px; text-align: center; animation: un-rise 0.6s var(--ease) backwards; }
  .meet-bot { width: 132px; height: 132px; }
  .meet-bot > [data-robot] { width: 100%; height: 100%; }
  .meet-hi { margin: 4px 0 0; font: 300 26px/32px var(--font-display); letter-spacing: -0.02em; color: var(--ink); }
  .meet-sub { margin: 0; font: 400 15px/22px var(--font-display); color: var(--ink-soft); }
  .meet-links { margin: 10px 0 0; font: 400 13px/18px var(--font-display); color: var(--ink-soft); }
  .meet-change, .meet-settings { padding: 0; border: 0; background: none; color: var(--ink); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .meet-change:hover, .meet-settings:hover { text-decoration-thickness: 2px; }
  .meet-pick { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; animation: un-rise 0.4s var(--ease); }
  .meet-pick[hidden] { display: none; }
  :root[data-theme="light"] .meet-pick .un-chip[aria-pressed="true"] { background: #1a1a1a; border-color: #1a1a1a; color: #fff; box-shadow: none; }
  /*dk*/ :root[data-theme="dark"] .meet-pick .un-chip[aria-pressed="true"] { background: #f2f2ee; border-color: #f2f2ee; color: #1c1c1b; box-shadow: none; } /*/dk*/
  .no-gl .meet-bot > [data-robot] { border-radius: 50%; background: radial-gradient(closest-side, #c4b5fd, rgba(139, 92, 246, 0.2) 70%, transparent 72%); }
  /* "Settings" in the introduction points at the gear in the sidebar */
  .gear.ping { animation: ping 1.4s var(--ease); }
  @keyframes ping { 0%, 100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); } 30%, 60% { box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.35); } }
  @media (prefers-reduced-motion: reduce) { html.arriving .app, .meet, .meet-pick, .gear.ping { animation: none; } }
  /* follow-up options under the assistant's last message: it stays proactive, and "Other" is always there */
  .opts { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; max-width: 82%; margin-top: -4px; }
  .opts .un-chip { animation: opt-in 0.5s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 70ms + 120ms); }
  .opts.gone { opacity: 0; transform: translateY(-4px); transition: opacity 0.25s, transform 0.25s; pointer-events: none; }
  @keyframes opt-in { from { opacity: 0; transform: translateY(8px); } }
  /* preview of the Work Order the assistant created (same field layout as the CMS detail) */
  .wo-card { display: block; margin-top: 12px; border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 10px; background: rgba(255, 255, 255, 0.04); overflow: hidden; color: inherit; text-decoration: none; animation: wo-in 0.6s var(--ease) 0.15s backwards; transition: border-color 0.25s, background 0.25s; }
  .wo-card:hover { border-color: rgba(221, 0, 255, 0.5); background: rgba(255, 255, 255, 0.07); }
  @keyframes wo-in { from { opacity: 0; transform: translateY(10px) scale(0.985); } }
  .wo-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px dashed rgba(255, 255, 255, 0.14); }
  .wo-head .id { font: 600 14px/20px var(--font-display); }
  .wo-head .open { margin-left: auto; font: 500 12px/16px var(--font-body); color: var(--ink-soft); }
  .wo-title { padding: 12px 14px 4px; font: 600 15px/20px var(--font-display); }
  .wo-desc { padding: 0 14px 12px; color: var(--ink-soft); font: 400 13px/18px var(--font-body); }
  .wo-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px dashed rgba(255, 255, 255, 0.14); }
  .wo-row .k { width: 92px; flex: none; font: 500 11px/16px var(--font-body); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); }
  .wo-row .v { display: flex; align-items: center; gap: 8px; min-width: 0; font: 400 13px/18px var(--font-body); }
  .wo-row .v.link { color: #9db4ff; }
  .wo-row .tag { padding: 1px 8px; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 4px; font: 400 12px/18px var(--font-body); color: var(--ink); }
  .wo-row .flag { width: 14px; height: 14px; fill: currentColor; }
  .snd { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: #d9c8ff; transition: background 0.2s; }
  .snd:hover { background: rgba(255, 255, 255, 0.08); }
  .snd .un-icon { width: 20px; height: 20px; }
  .snd[hidden] { display: none; }   /* sound toggle hidden for now: remove the `hidden` attribute to bring it back */
  .snd .off { display: none; } .snd.muted .on { display: none; } .snd.muted .off { display: block; }
  .foot-right { display: flex; align-items: center; gap: 4px; }

  #fg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; display: block; z-index: 20; }
  .no-gl .assistant [data-robot] { margin: 18%; width: 64%; height: 64%; border-radius: 50%; background: radial-gradient(closest-side, #c4b5fd, rgba(139, 92, 246, 0.2) 70%, transparent 72%); }

  @media (prefers-reduced-motion: no-preference) {
    .stage > * { animation: rise 0.7s var(--ease) backwards; }
    .stage > .greeting { animation-delay: 0.08s; }
    .chatbar { animation: rise 0.7s var(--ease) 0.24s backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; } }

  /* ---------- small screens: the sidebar becomes a drawer ---------- */
  @media (max-width: 860px) {
    .backdrop { --k: 2.4; }   /* on a phone the ribbon is scaled up so its crest stays visible */
    .app { grid-template-columns: minmax(0, 1fr); }
    .sidebar { position: fixed; z-index: 30; left: 0; top: 0; width: min(300px, 84vw); transform: translateX(-102%); transition: transform 0.3s var(--ease); --side-light-a: 1; }
    .sidebar::after { background: linear-gradient(180deg, #05010d, #570a9e); }
    .menu-open .sidebar { transform: none; }
    .scrim { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(0, 0, 0, 0.6); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .menu-open .scrim { opacity: 1; pointer-events: auto; }
    .main { padding: 12px 16px max(16px, env(safe-area-inset-bottom, 0px)); }
    .topbar { display: flex; align-items: center; justify-content: space-between; height: 44px; }
    .topbar .brand { padding: 0; font-size: 18px; }
    .topbar .brand svg { width: 22px; height: 22px; }
    .stage { padding-bottom: 24px; }
    .chatting .assistant { top: 60px; left: calc(50vw - 44px); }

  .ap-more { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border: 1px solid #e0e1e6; border-radius: 50%; background: #fff; color: #1a1a1a; transition: background 0.2s; }
  /*dk*/ :root[data-theme="dark"] .ap-more { border: 1px solid #30302d; background: #1c1c1b; color: #f2f2ee; } /*/dk*/
  .ap-more:hover { background: #f7f7f5; }
  /*dk*/ :root[data-theme="dark"] .ap-more:hover { background: #252523; } /*/dk*/
  .ap-more svg { width: 18px; height: 18px; fill: currentColor; }
  .ap-title h2 { display: flex; align-items: center; gap: 8px; }
  .ap-fav { display: inline-grid; }
  .ap-fav .un-icon { width: 16px; height: 16px; fill: #874bff; stroke: #874bff; }   /* a favorite shows a small star by its name */
  :root[data-theme="light"] .ap-menu { --un-menu: #fff; --un-line: #ececea; --un-ink: #1a1a1a; --un-ink-soft: #7b7b79; border-radius: 16px; box-shadow: 0 16px 40px -12px rgba(26, 26, 26, 0.22); }
  /*dk*/ :root[data-theme="dark"] .ap-menu { --un-menu: #1c1c1b; --un-line: #30302d; --un-ink: #f2f2ee; --un-ink-soft: #a5a59f; border-radius: 16px; box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.48); } /*/dk*/
  :root[data-theme="light"] .ap-menu button { border-radius: 10px; }
  /*dk*/ :root[data-theme="dark"] .ap-menu button { border-radius: 10px; } /*/dk*/
  :root[data-theme="light"] .ap-menu button:hover { background: #f7f7f5; }
  /*dk*/ :root[data-theme="dark"] .ap-menu button:hover { background: #252523; } /*/dk*/
  .app-mode:not(.drawer-closed) .ap-ask { display: none; }   /* "Ask …" only when the chat drawer is closed */
  .ap-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .ap-kpi { display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 12px; background: #f7f7f5; }
  /*dk*/ :root[data-theme="dark"] .ap-kpi { background: #252523; } /*/dk*/
  .ap-kpi span { font: 400 13px/18px var(--font-display); color: #7b7b79; }
  /*dk*/ :root[data-theme="dark"] .ap-kpi span { color: #a5a59f; } /*/dk*/
  .ap-kpi b { font: 600 22px/28px var(--font-display); color: #1a1a1a; }
  /*dk*/ :root[data-theme="dark"] .ap-kpi b { color: #f2f2ee; } /*/dk*/
  .ap-table { border: 1px solid #ececea; border-radius: 12px; overflow: hidden; }
  /*dk*/ :root[data-theme="dark"] .ap-table { border: 1px solid #30302d; } /*/dk*/
  .ap-row { display: grid; grid-template-columns: var(--gtc, 1.4fr 1fr 1fr 1.2fr 1fr); gap: 12px; padding: 12px 16px; border-top: 1px solid #ececea; font: 400 14px/20px var(--font-display); color: #1a1a1a; }
  /*dk*/ :root[data-theme="dark"] .ap-row { border-top: 1px solid #30302d; color: #f2f2ee; } /*/dk*/
  .ap-row:first-child { border-top: 0; }
  .ap-th { background: #f7f7f5; font-weight: 500; color: #7b7b79; font-size: 13px; }
  /*dk*/ :root[data-theme="dark"] .ap-th { background: #252523; color: #a5a59f; } /*/dk*/
  .ap-row span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ap-row .un-status, .ap-row .un-prio { overflow: visible; justify-self: start; }
  /* app types: dashboard · export tool · builder (same warm greys and type scale as the cards) */
  .ap-kpi.bad b { color: var(--un-bad, #e03131); }
  /*dk*/ :root[data-theme="dark"] .ap-kpi.bad b { color: var(--un-bad, #ff6b6b); } /*/dk*/
  .ap-filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .ap-select { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 14px; border: 1px solid #ececea; border-radius: 10px; background: #fff; color: #1a1a1a; font: 400 14px/20px var(--font-display); transition: border-color 0.2s; }
  /*dk*/ :root[data-theme="dark"] .ap-select { border: 1px solid #30302d; background: #1c1c1b; color: #f2f2ee; } /*/dk*/
  .ap-select:hover { border-color: #d3d4d0; }
  /*dk*/ :root[data-theme="dark"] .ap-select:hover { border-color: #3a3a36; } /*/dk*/
  .ap-select .un-icon { width: 14px; height: 14px; color: #7b7b79; }
  /*dk*/ :root[data-theme="dark"] .ap-select .un-icon { color: #a5a59f; } /*/dk*/
  .ap-select--full { width: 100%; justify-content: space-between; }
  .ap-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 1100px) { .ap-grid2 { grid-template-columns: minmax(0, 1fr); } }
  .ap-panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; padding: 18px; border: 1px solid #ececea; border-radius: 16px; background: #fff; }
  /*dk*/ :root[data-theme="dark"] .ap-panel { border: 1px solid #30302d; background: #1c1c1b; } /*/dk*/
  .ap-panel > header { display: flex; align-items: flex-start; gap: 12px; }
  .ap-panel > header > div { flex: 1; min-width: 0; }
  .ap-panel h3 { margin: 0; font: 600 14px/20px var(--font-display); color: #1a1a1a; }
  /*dk*/ :root[data-theme="dark"] .ap-panel h3 { color: #f2f2ee; } /*/dk*/
  .ap-panel header p { margin: 2px 0 0; font: 400 12px/16px var(--font-display); color: #7b7b79; }
  /*dk*/ :root[data-theme="dark"] .ap-panel header p { color: #a5a59f; } /*/dk*/
  .ap-panel h4 { margin: 8px 0 0; font: 600 13px/18px var(--font-display); color: #1a1a1a; }
  /*dk*/ :root[data-theme="dark"] .ap-panel h4 { color: #f2f2ee; } /*/dk*/
  .ap-panel .ap-table { border-radius: 10px; }
  .ap-vbars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-items: end; height: 170px; padding-top: 8px; }
  .ap-vbar { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .ap-vbar i { width: 100%; max-width: 44px; height: var(--h); min-height: 4px; border-radius: 8px 8px 4px 4px; background: #1a1a1a; transform-origin: bottom; animation: un-grow-y 0.8s var(--ease) both; }
  /*dk*/ :root[data-theme="dark"] .ap-vbar i { background: #f2f2ee; } /*/dk*/
  .ap-vbar.bad i { background: var(--un-bad, #e03131); }
  /*dk*/ :root[data-theme="dark"] .ap-vbar.bad i { background: var(--un-bad, #ff6b6b); } /*/dk*/
  .ap-vbar b { font: 600 12px/16px var(--font-display); color: #1a1a1a; }
  /*dk*/ :root[data-theme="dark"] .ap-vbar b { color: #f2f2ee; } /*/dk*/
  .ap-vbar span { font: 400 12px/16px var(--font-display); color: #7b7b79; }
  /*dk*/ :root[data-theme="dark"] .ap-vbar span { color: #a5a59f; } /*/dk*/
  @keyframes un-grow-y { from { transform: scaleY(0); } }
  .ap-hbars { display: grid; gap: 10px; }
  .ap-hbar { display: grid; grid-template-columns: 80px 1fr 24px; align-items: center; gap: 10px; font: 400 13px/18px var(--font-display); color: #1a1a1a; }
  /*dk*/ :root[data-theme="dark"] .ap-hbar { color: #f2f2ee; } /*/dk*/
  .ap-hbar i { height: 8px; width: var(--w); border-radius: 8px; background: #1a1a1a; transform-origin: left; animation: un-grow 0.8s var(--ease) both; }
  /*dk*/ :root[data-theme="dark"] .ap-hbar i { background: #f2f2ee; } /*/dk*/
  .ap-hbar b { font-weight: 600; text-align: right; }
  .ap-panel--hero { gap: 12px; }
  .ap-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 12px; background: #f7f7f5; }
  /*dk*/ :root[data-theme="dark"] .ap-tabs { background: #252523; } /*/dk*/
  .ap-tabs [role="tab"] { height: 36px; border-radius: 9px; font: 500 14px/20px var(--font-display); color: #7b7b79; transition: background 0.2s, color 0.2s; }
  /*dk*/ :root[data-theme="dark"] .ap-tabs [role="tab"] { color: #a5a59f; } /*/dk*/
  .ap-tabs [aria-selected="true"] { background: #fff; color: #1a1a1a; box-shadow: 0 1px 2px rgba(26, 26, 26, 0.08); }
  /*dk*/ :root[data-theme="dark"] .ap-tabs [aria-selected="true"] { background: #1c1c1b; color: #f2f2ee; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18); } /*/dk*/
  .ap-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; border-radius: 99px; background: #1a1a1a; color: #fff; font: 500 15px/20px var(--font-display); transition: transform 0.2s, box-shadow 0.2s; }
  /*dk*/ :root[data-theme="dark"] .ap-primary { background: #f2f2ee; color: #1c1c1b; } /*/dk*/
  .ap-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 26px -14px rgba(26, 26, 26, 0.6); }
  /*dk*/ :root[data-theme="dark"] .ap-primary:hover { box-shadow: 0 12px 26px -14px rgba(0, 0, 0, 1); } /*/dk*/
  .ap-primary .un-icon { width: 18px; height: 18px; }
  .ap-note { margin: 0; text-align: center; font: 400 12px/16px var(--font-display); color: #7b7b79; }
  /*dk*/ :root[data-theme="dark"] .ap-note { color: #a5a59f; } /*/dk*/
  .ap-stack { display: grid; gap: 12px; }
  .ap-check { display: flex; align-items: center; gap: 10px; font: 400 14px/20px var(--font-display); color: #1a1a1a; cursor: pointer; }
  /*dk*/ :root[data-theme="dark"] .ap-check { color: #f2f2ee; } /*/dk*/
  .ap-check input { width: 16px; height: 16px; margin: 0; accent-color: #1a1a1a; }
  /*dk*/ :root[data-theme="dark"] .ap-check input { accent-color: #f2f2ee; } /*/dk*/
  .ap-swatches { display: flex; gap: 8px; }
  .ap-swatch { width: 28px; height: 28px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px #fff; border: 2px solid transparent; }
  /*dk*/ :root[data-theme="dark"] .ap-swatch { box-shadow: inset 0 0 0 2px #1c1c1b; } /*/dk*/
  .ap-swatch.on { border-color: #1a1a1a; }
  /*dk*/ :root[data-theme="dark"] .ap-swatch.on { border-color: #f2f2ee; } /*/dk*/
  .ap-field { display: grid; gap: 6px; min-width: 0; }
  .ap-field label { font: 500 13px/18px var(--font-display); color: #1a1a1a; }
  /*dk*/ :root[data-theme="dark"] .ap-field label { color: #f2f2ee; } /*/dk*/
  .ap-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
  .ap-field--wide { grid-column: 1 / -1; }
  .ap-input { width: 100%; min-width: 0; padding: 8px 12px; border: 1px solid #ececea; border-radius: 10px; background: #fff; color: #1a1a1a; font: 400 14px/20px var(--font-display); resize: vertical; outline: 0; }
  /*dk*/ :root[data-theme="dark"] .ap-input { border: 1px solid #30302d; background: #1c1c1b; color: #f2f2ee; } /*/dk*/
  .ap-input:focus { border-color: #cfc5ff; }
  /*dk*/ :root[data-theme="dark"] .ap-input:focus { border-color: #4b3d7d; } /*/dk*/
  .ap-steps { margin: 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 10px; }
  .ap-steps li { position: relative; display: grid; gap: 2px; padding: 12px 14px 12px 48px; border-radius: 12px; background: #f7f7f5; counter-increment: step; }
  /*dk*/ :root[data-theme="dark"] .ap-steps li { background: #252523; } /*/dk*/
  .ap-steps li::before { content: counter(step); position: absolute; left: 14px; top: 12px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: #1a1a1a; color: #fff; font: 600 12px/1 var(--font-display); }
  /*dk*/ :root[data-theme="dark"] .ap-steps li::before { background: #f2f2ee; color: #1c1c1b; } /*/dk*/
  .ap-steps b { font: 500 14px/20px var(--font-display); color: #1a1a1a; }
  /*dk*/ :root[data-theme="dark"] .ap-steps b { color: #f2f2ee; } /*/dk*/
  .ap-steps span { font: 400 13px/18px var(--font-display); color: #7b7b79; }
  /*dk*/ :root[data-theme="dark"] .ap-steps span { color: #a5a59f; } /*/dk*/
  /* ---------- dark (new UI): the same layout and components as light, in warm dark greys; no background image,
     just the two soft purple glows (.un-glow). The rules marked dk next to each light rule are its dark twin (generated). ---------- */
  :root[data-theme="dark"] { --bg: #121211; }
  :root[data-theme="dark"] .backdrop { background: var(--bg); }
  :root[data-theme="dark"] .backdrop::before, :root[data-theme="dark"] .backdrop::after { display: none; }
  :root[data-theme="dark"] .brand .mark { filter: invert(1); }
  /* dark ↔ light: while html.theming is on, every color eases over at the same time */
  html.theming *, html.theming *::before, html.theming *::after {
    transition: background-color 0.8s var(--ease) var(--d, 0s), color 0.8s var(--ease) var(--d, 0s), border-color 0.8s var(--ease) var(--d, 0s), fill 0.8s var(--ease) var(--d, 0s), stroke 0.8s var(--ease) var(--d, 0s), box-shadow 0.8s var(--ease) var(--d, 0s);
  }
  html.theming .sidebar::before, html.theming .sidebar::after, html.theming .backdrop::before, html.theming .backdrop::after { transition: opacity 0.8s var(--ease) var(--d, 0s); }
    html.theming .un-toggle__track, html.theming .un-toggle__track::after { transition: transform 0.3s var(--ease), background 0.3s var(--ease); }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="un-glow" aria-hidden="true"><i class="a"></i><i class="b"></i></div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <a class="brand" href="onboarding.html" data-tip="Back to welcome" aria-label="Ultranova: back to welcome">
      <img class="mark" src="assets/logo-mark.svg" width="26" height="26" alt="">
      <span class="brand-text">Ultranova</span>
    </a>
    <!-- New ▾ (always at the top of the menu): start a new chat, app or task -->
    <div class="new-wrap">
      <button class="new-btn" type="button" id="newBtn" aria-haspopup="menu" aria-expanded="false" data-tip="New">
        <svg class="un-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span class="grow">New</span>
        <svg class="un-icon chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <label class="side-search" data-tip="Search">
        <svg class="un-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input type="search" id="chatSearch" placeholder="Search" aria-label="Search conversations" autocomplete="off">
      </label>
    </div>
    <nav class="nav">
      <div>
        <button class="nav-item active" type="button" data-tip="Chat" id="chatToggle" aria-expanded="true" aria-controls="history">
          <svg class="un-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4A2.5 2.5 0 0 1 4 13.5z"/></svg>
          <span class="grow">Chat</span>
          <svg class="un-icon chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"/></svg>
        </button>
        <div class="history" id="history">
          <div class="history-in">
          <ul id="chatList"><li><button class="chat-item live untitled" type="button"><span>New conversation</span><i class="more" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></i></button></li></ul>   <!-- the conversation in progress: "New conversation" until its first message gives it a title -->
          </div>
        </div>
      </div>
      <div>
        <button class="nav-item" type="button" data-tip="Apps" id="appsToggle" aria-expanded="false" aria-controls="appsHistory">
          <svg class="un-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
          <span class="grow">Apps</span>
          <svg class="un-icon chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"/></svg>
        </button>
        <!-- the apps you use, favorites first (☆ in each app's ··· menu); filled by the script -->
        <div class="history" id="appsHistory" hidden>
          <div class="history-in">
            <div class="fav-box" id="favBox">   <!-- favorites share one very light container -->
              <button class="list-head" type="button" id="favLabel" aria-expanded="true" aria-controls="favApps"><span>Favorites</span><span class="ptag" id="favCount">0</span><svg class="un-icon lchev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
              <ul id="favApps" class="app-list"></ul>
            </div>
            <button class="list-head" type="button" id="recentLabel" aria-expanded="true" aria-controls="recentApps"><span>Recent</span><span class="ptag" id="recentCount">0</span><svg class="un-icon lchev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
            <ul id="recentApps" class="app-list"></ul>
          </div>
        </div>
      </div>
      <button class="nav-item" type="button" data-tip="Tasks">
        <svg class="un-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l2 2 3-3.5M3 13l2 2 3-3.5M3 20l2 2 3-3.5M12 7h9M12 14h9M12 21h9"/></svg>
        <span class="grow">Tasks</span>
      </button>
    </nav>
    <a class="cms" id="cms" data-tip="Back to CMS" href="/work-orders" aria-live="polite" aria-label="Back to CMS">
      <span class="pane def">
        <svg class="cog" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8l1.5 2.2 2.6-.6.9 2.5 2.5.9-.6 2.6L21.2 12l-2.3 1.6.6 2.6-2.5.9-.9 2.5-2.6-.6L12 21.2l-1.5-2.2-2.6.6-.9-2.5-2.5-.9.6-2.6L2.8 12l2.3-1.6-.6-2.6 2.5-.9.9-2.5 2.6.6z"/></svg>
        <span class="grow">Back to CMS</span>
        <svg class="go icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
      <span class="pane alt" aria-hidden="true">
        <svg class="kind icon" viewBox="0 0 24 24" id="cmsKind"></svg>
        <span class="grow" id="cmsText">WO created</span>
        <span class="state"><svg class="spin" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></svg><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      </span>
    </a>
    <div class="side-foot">
      <button class="me" type="button" id="profileBtn" data-tip="Profile" aria-label="Your profile" aria-haspopup="menu" aria-expanded="false"><img src="assets/avatar-leti.jpg" alt=""></button>
      <div class="foot-right">
      <button class="un-toggle un-toggle--sm" type="button" id="theme" data-tip="Dark mode" role="switch" aria-checked="true" aria-label="Dark mode"><span class="un-toggle__track"></span><span class="un-toggle__label">Dark</span></button>
      <button class="snd" type="button" id="sound" hidden aria-label="Sound effects" aria-pressed="true">
        <svg class="un-icon on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5zM15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
        <svg class="un-icon off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5zM16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <button class="gear" type="button" aria-label="Settings" data-tip="Settings">
        <svg class="un-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5l1.6 2.3 2.8-.5.9 2.7 2.7.9-.5 2.8L21.8 12l-2.3 1.6.5 2.8-2.7.9-.9 2.7-2.8-.5L12 21.8l-1.6-2.3-2.8.5-.9-2.7-2.7-.9.5-2.8L2.2 12l2.3-1.6-.5-2.8 2.7-.9.9-2.7 2.8.5z"/></svg>
      </button>
      <button class="gear nav-close" type="button" id="navClose" data-tip="Expand sidebar" aria-label="Collapse sidebar" aria-controls="sidebar"><svg class="un-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- an app opens here, in the middle; the chat moves to the right as a drawer -->
  <section class="appview" id="appView" aria-live="polite"></section>

  <main class="main">
    <div class="drawer-head">
      <span class="grow aname">Lumen</span>   <!-- the assistant's name (follows "Change assistant") -->
      <button class="pcollapse" type="button" id="drawerClose" aria-label="Minimize chat" data-tip="Minimize"><svg class="un-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <div class="topbar">
      <button class="un-icon-btn" type="button" id="menuBtn" aria-label="Open menu" style="width:40px;height:40px">
        <svg class="un-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>
(function () {
  'use strict';
  var robots = null;

  /* the placeholder follows the conversation: a general invitation at first, then what the assistant is asking for */
  var DEFAULT_PH = 'Ask anything', ctx = null;

  var ASKS = {
    'Research a prospect': 'e.g. Acme Corp, or Jane Smith at Acme…',
    'Draft an email': 'e.g. Tell the vendor the delivery is two days late…',
    'Draft an outreach email': 'e.g. Introduce our team to the new facilities manager…',
    'Create a work order': 'e.g. The boiler in Building A isn’t working…',

  /* once something is done: the likely next step (Tab accepts it), like a suggested follow-up */
  var NEXT = {
    'Create a work order': 'Assign it to a technician…',
    'PM': 'Set the next due date and assignee…',
    'Research a prospect': 'Draft an outreach email to them…',
    'Draft an email': 'Make it shorter and send it…',
    'Draft an outreach email': 'Make it shorter and send it…',
    'Plan my week': 'Move anything that can wait to next week…',
    'Create a task': 'Set a due date and remind me…',

  var app = document.getElementById('app'), prompt = document.getElementById('prompt'), toastEl = document.getElementById('toast'), toastTimer;

  /* ---- conversation (prototype): a suggestion runs as a prompt right away; the assistant "thinks", answers with a chime,

  var main = document.querySelector('.main'), thread = document.getElementById('thread'), sendBtn = document.querySelector('.un-icon-btn--send'), busy = false;
  var FOLLOW = {
    'Research a prospect': 'Sure. Who or which company should I look into?',
    'Draft an email': 'Happy to. Who’s it for, and what would you like to say?',
    'Draft an outreach email': 'Happy to. Who’s it for, and what would you like to say?',
    'Create a work order': 'On it. Describe the issue and I’ll create the work order.',
    'Plan my week': 'Let’s plan it. What do you need to get done?',
    'Create a task': 'Sure. What’s the task?',
    'Review overdue work orders': 'I can do that. Which location or team should I look at?',
    'Summarize my day': 'Of course. Anything in particular to include?'
  };
  var DONE = {
    'Research a prospect': 'Done. I put together a short brief and saved it to your notes.',
    'Draft an email': 'Done. The draft is ready in your drafts folder for you to review.',
    'Draft an outreach email': 'Done. The draft is ready in your drafts folder for you to review.',
    'Plan my week': 'Done. I organized your week and blocked time for each item.',
    'Create a task': 'Done. The task is created and assigned to you.',
    'Review overdue work orders': 'Done. I found what’s overdue and flagged what needs you first.',
    'Summarize my day': 'Done. Your summary is ready.'
  };
  function addMsg(who, html) {
    var m = document.createElement('div'); m.className = 'un-msg un-msg--' + who;
    m.innerHTML = who === 'ai' ? '<b>' + agentName + '</b>' + html : html; thread.appendChild(m);
    thread.scrollTop = thread.scrollHeight; return m;
  }
  function esc(t) { return t.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function reply(text) {
    var kind = null, out;
    if (ctx) {                                   /* answering what the assistant asked */
      kind = ctx === 'Create a work order' ? 'WO' : null;
      out = kind ? null : (DONE[ctx] || 'Got it. I’m on it and I’ll let you know when I need you.');
    } else if (FOLLOW[text]) {                   /* a suggestion: the assistant asks for details */
      return { text: FOLLOW[text], ask: text };
    } else {
      kind = /\b(work order|wo)\b/i.test(text) ? 'WO' : /\b(pm|preventive)\b/i.test(text) ? 'PM' : null;
      out = kind ? null : 'Got it. I’m on it and I’ll let you know when I need you.';
    }
    if (kind) return { long: true, text: 'Done. <b style="display:inline;font:inherit;color:inherit">{label}</b> is created in the CMS. Use the button at the bottom left to open it.', created: kind };
    return { long: true, text: out };
  }
  /* options offered after each answer, so the user always has a next move; "Other" lets them say something else */
  var ANSWERS = {
    'Create a work order': ['The boiler in Building A isn’t working', 'AC not cooling on floor 2', 'Water leak in the break room'],
    'Research a prospect': ['Acme Corp', 'Jane Smith at Acme', 'One of our competitors'],
    'Draft an email': ['Tell the vendor the delivery is two days late', 'Follow up on yesterday’s quote', 'Thank a customer for their order'],
    'Draft an outreach email': ['Introduce our team to a new contact', 'Follow up after a meeting', 'Re-engage a quiet account'],
    'Plan my week': ['Finish the PM schedule', 'Review 3 requests and visit Site B', 'Protect two hours for focus time'],
    'Create a task': ['Follow up with the vendor on Friday', 'Order spare filters', 'Update the safety checklist'],
    'Review overdue work orders': ['Building A', 'The night shift team', 'All locations'],
    'Summarize my day': ['Include open work orders', 'Include approvals', 'Keep it to three lines']
  };
  var NEXTOPTS = {
    'Create a work order': ['Assign it to a technician', 'Set the priority to High', 'Create another work order'],
    'PM': ['Set the next due date and assignee', 'Create the work order now', 'Show me the schedule'],
    'Research a prospect': ['Draft an outreach email to them', 'Add them to my pipeline', 'Research a similar company'],
    'Draft an email': ['Make it shorter and send it', 'Change the tone', 'Draft a follow-up for next week'],
    'Draft an outreach email': ['Make it shorter and send it', 'Change the tone', 'Draft a follow-up for next week'],
    'Plan my week': ['Move anything that can wait to next week', 'Block focus time', 'Add a reminder for Monday'],
    'Create a task': ['Set a due date and remind me', 'Assign it to someone else', 'Create another task'],
    'Review overdue work orders': ['Reassign the most urgent one', 'Notify the teams involved', 'Show me what’s blocked'],
    'Summarize my day': ['Share it with my team', 'Add it to my notes', 'Plan tomorrow']
  };
  var GENERIC_OPTS = UltranovaWow.list.slice(0, 3).map(function (w) { return w.title; });   /* the starters, in the user's voice */
  function clearOpts() {
    [].forEach.call(thread.querySelectorAll('.opts'), function (o) { o.classList.add('gone'); setTimeout(function () { o.remove(); }, 260); });
  }
  function showOpts(list) {
    var box = document.createElement('div'); box.className = 'opts'; box.setAttribute('role', 'group'); box.setAttribute('aria-label', 'Suggested replies');
    list.slice(0, 3).concat(['Other…']).forEach(function (t, i) {

    });

  }
  thread.addEventListener('click', function (e) {

    if (c.textContent === 'Other…') { clearOpts(); prompt.placeholder = 'Tell me something else…'; suggestion = ''; hint(); prompt.focus(); return; }
    send(c.textContent);
  });

  /* a Work Order preview built from what the user wrote (prototype: location, asset and priority are inferred from keywords) */
  function woPreview(label, text) {
    var t = text.replace(/\s+/g, ' ').trim(), first = t.split(/[.,;]| and | but | because /i)[0].trim() || t;
    var name = first.charAt(0).toUpperCase() + first.slice(1, 56) + (first.length > 56 ? '…' : '');
    var desc = first.length < t.length ? t.charAt(0).toUpperCase() + t.slice(1) : 'Created by ' + agentName + ' from the chat.';
    var bld = /building\s+([a-z0-9])/i.exec(t), loc = bld ? 'Building ' + bld[1].toUpperCase() : 'Building A';
    var asset = /pump/i.test(t) ? 'Water Cooling Pump' : /hvac|a\/c|air/i.test(t) ? 'HVAC Unit 3' : /elevator|lift/i.test(t) ? 'Elevator 2' : 'Boiler #2';
    var high = /leak|urgent|fire|smoke|flood|broken|not working|isn.t working/i.test(t), prio = high ? 'High' : 'Medium';
    var a = document.createElement('a'); a.className = 'wo-card'; a.href = '/work-orders'; a.setAttribute('aria-label', label + ': ' + name + '. Open in the CMS');

      + '<div class="wo-title">' + esc(name) + '</div><div class="wo-desc">' + esc(desc) + '</div>'
      + '<div class="wo-row"><span class="k">Location</span><span class="v link">' + esc(loc) + '</span></div>'
      + '<div class="wo-row"><span class="k">Asset</span><span class="v link">' + esc(asset) + '</span><span class="tag">Operational</span></div>'
      + '<div class="wo-row"><span class="k">Assigned to</span><span class="v">Unassigned</span></div>'
      + '<div class="wo-row"><span class="k">Priority</span><span class="v"><svg class="flag" viewBox="0 0 24 24" aria-hidden="true" style="color:' + (high ? '#ff7a7a' : '#ffc86b') + '"><path d="M6 3h1.5v18H6zM8 4h11l-2.5 4.2L19 12H8z"/></svg>' + prio + '</span></div>';
    return a;
  }
  /* ---- a "wow" task, as a conversation (wow.js):
     the request is posted as the user's message → the assistant picks it up (intro) → asks the few setup questions, one at a time,
     with suggested replies and a matching placeholder (a typed answer works too) → shows the steps it works through
     (spinner → check) → answers with what it prepared (a result card to approve) and the likely follow-ups. ---- */
  var STEP_MS = 850, task = null;
  /* the Progress card in the right panel: 0 asked → 1 setting it up → 2 working → 3 done */
  var stepsEl = document.getElementById('steps');
  var STEP_NAMES = ['0/4', '2/4', '3/4', '4/4'];   /* how far along, as a fraction of the 4 dots (the current dot counts) */
  function setStep(n) { var tg = document.getElementById('tagProgress'); tg.textContent = STEP_NAMES[n]; tg.className = 'ptag' + (n === 3 ? ' done' : n > 0 ? ' live' : ''); stepsEl.style.setProperty('--step', n); stepsEl.setAttribute('aria-valuenow', n); [].forEach.call(stepsEl.children, function (d, i) { d.className = 'dot' + (i < n ? ' done' : i === n ? ' now' : ''); }); }
  setStep(0);
  /* the little counts in the panel follow the thread: Outputs = what was prepared (result cards, work orders),
     Context = what you told the assistant (your messages and answers) */
  function refreshTags() {
    document.getElementById('tagOutputs').textContent = thread.querySelectorAll('.un-res, .wo-card').length;
    document.getElementById('tagContext').textContent = thread.querySelectorAll('.un-msg--user').length;
  }
  new MutationObserver(refreshTags).observe(thread, { childList: true, subtree: true });
  /* starts collapsed; opens by itself once the user sends something or picks a task (and can be toggled) */
  var progressBtn = document.getElementById('progressToggle');
  function showProgress(open) { progressBtn.setAttribute('aria-expanded', String(open)); stepsEl.classList.toggle('closed', !open); }

    showProgress(progressBtn.getAttribute('aria-expanded') !== 'true');
  });
  /* the right panel can collapse to a thin rail of icons (remembered); clicking an icon opens it again */
  var appEl = document.getElementById('app'), panelEl = document.getElementById('panel'), panelBtn = document.getElementById('panelToggle');
  function setPanel(closed) {
    appEl.classList.toggle('panel-closed', closed);

  }

  panelEl.addEventListener('click', function (e) { var r = e.target.closest('.panel > .prow'); if (r && appEl.classList.contains('panel-closed')) setPanel(false); });
  try { if (localStorage.getItem('ultranova.panel') === 'closed') setPanel(true); } catch (e) {}
  /* rail tooltips, to the left of the icon */
  var ptip = document.createElement('div'); ptip.className = 'un-tooltip un-tooltip--left'; ptip.setAttribute('role', 'tooltip'); document.body.appendChild(ptip);
  function ptipFor(e) {
    var t = e.target.closest && e.target.closest('#panel [data-tip]');
    if (!t || !appEl.classList.contains('panel-closed')) { ptip.classList.remove('show'); return; }
    var r = t.getBoundingClientRect(); ptip.textContent = t.id === 'panelToggle' ? 'Expand panel' : t.getAttribute('data-tip');
    ptip.style.left = (r.left - 12) + 'px'; ptip.style.top = (r.top + r.height / 2) + 'px'; ptip.classList.add('show');
  }
  ['mouseover', 'focusin'].forEach(function (ev) { panelEl.addEventListener(ev, ptipFor); });
  ['mouseleave', 'focusout', 'click'].forEach(function (ev) { panelEl.addEventListener(ev, function () { ptip.classList.remove('show'); }); });
  function say(html, then, wait) {
    var m = addMsg('ai', '<span class="un-typing" aria-label="Typing"><i></i><i></i><i></i></span>');
    /* the very first reply: the greeting comes alone (semibold), then the rest animates in as the next message */
    if (greetFirst) {
      greetFirst = false; thread.removeChild(m);
      var g = addMsg('ai', '<span class="un-typing" aria-label="Typing"><i></i><i></i><i></i></span>');
      setTimeout(function () {
        g.innerHTML = '<b>' + agentName + '</b><span class="greet">Hi Leti, I’m <span class="aname">' + agentName + '</span>. I’ll be your assistant in Ultranova.</span>';
        thread.scrollTop = thread.scrollHeight;
        setTimeout(function () { say(html, then, wait); }, 650);
      }, 700);
      return g;
    }
    setTimeout(function () { m.innerHTML = '<b>' + agentName + '</b>' + html; thread.scrollTop = thread.scrollHeight; if (then) then(m); }, wait || 800);
    return m;
  }
  function replies(list) {   /* suggested answers to a setup question (the placeholder invites a typed one instead of an "Other" chip) */
    var box = document.createElement('div'); box.className = 'opts'; box.setAttribute('role', 'group'); box.setAttribute('aria-label', 'Suggested replies');
    list.forEach(function (t, i) { var b = document.createElement('button'); b.type = 'button'; b.className = 'un-chip'; b.setAttribute('data-sfx', ''); b.style.setProperty('--i', i); b.textContent = t; box.appendChild(b); });
    thread.appendChild(box); thread.scrollTop = thread.scrollHeight;
  }
  function startTask(w, opt) {
    if (!w || busy) return;
    clearOpts(); busy = true; main.classList.add('chatting');

    prompt.value = ''; setReady(); grow(); ctx = null; suggestion = ''; hint(); prompt.placeholder = DEFAULT_PH;
    if (robots) robots.hop('hero');
    task = { w: w, i: 0, a: {} }; setStep(1); showProgress(true); setCurrentChat(w.title);
    say(w.intro, function () { setTimeout(askNext, 450); });
  }
  function askNext() {
    var q = task.w.setup[task.i];
    if (!q) { var t = task; task = null; prompt.placeholder = DEFAULT_PH; runWork(t.w, t.a); return; }
    say(q.q, function () { replies(q.replies); prompt.placeholder = q.ph; busy = false; prompt.focus({ preventScroll: true }); });
  }
  function answer(text) {
    var q = task.w.setup[task.i];
    clearOpts(); busy = true; addMsg('user', esc(text));
    prompt.value = ''; setReady(); grow(); prompt.placeholder = DEFAULT_PH;
    task.a[q.id] = text; task.i++;
    /* a connection (calendar, Slack, Teams) only when the answer asks for it: prototype, it just says it's connected */
    var note = typeof q.connect === 'function' ? q.connect(text) : (q.connect && text === q.replies[0] ? q.connect : '');
    if (note) { say('<span class="un-badge">' + note + '</span>', function () { setTimeout(askNext, 350); }, 700); }
    else setTimeout(askNext, 250);
  }
  function runWork(w, a) {
    busy = true; setStep(2);
    var m = addMsg('ai', '<ol class="un-trace" aria-label="Working on it"></ol>'); m.classList.add('un-msg--wide');
    var ol = m.querySelector('.un-trace'), i = 0;
    (function step() {

    var tabs = '<div class="ap-tabs" role="tablist">' + d.tabs.map(function (t, i) { return '<button type="button" role="tab" aria-selected="' + (i === 0) + '">' + esc(t) + '</button>'; }).join('') + '</div>';
    var check = function (label, on) { return '<label class="ap-check"><input type="checkbox"' + (on ? ' checked' : '') + '><span>' + esc(label) + '</span></label>'; };
    var select = function (label, value) { return '<div class="ap-field"><label>' + esc(label) + '</label><button type="button" class="ap-select ap-select--full"><span>' + esc(value) + '</span>' + CHEV_S + '</button></div>'; };
    return '<section class="ap-panel ap-panel--hero">' + tabs
      + '<div class="ap-field"><label>Work orders</label><button type="button" class="ap-select ap-select--full"><span>' + esc(d.selection) + '</span>' + CHEV_S + '</button></div>'
      + '<button type="button" class="ap-primary" data-ap-act="print"><svg class="un-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/></svg>Print report</button>'
      + '<p class="ap-note">Opens your browser’s print dialog. Only the report is printed.</p></section>'
      + panel('Report quality', 'Shared look, content and level of detail for every PDF',
          '<div class="ap-stack">' + check('Include a header on every page', false) + check('Include a footer on every page', true)
          + '<div class="ap-field"><label>Accent color</label><div class="ap-swatches">' + ['#1a1a1a', '#874bff', '#e03131', '#7b7b79'].map(function (c, i) { return '<button type="button" class="ap-swatch' + (i === 0 ? ' on' : '') + '" style="--c:' + c + '" aria-label="Accent ' + c + '"></button>'; }).join('') + '</div></div>'
          + '<h4>Content</h4>' + check('Hide sections with no recorded content', true) + check('Add custom content', false)

          + '<h4>Detail and print</h4>' + select('Checklist detail', 'Standard: task, result and evidence') + '</div>');
  }
  function apBuilder(a) {
    var d = a.data;
    var field = function (f) {
      return '<div class="ap-field' + (f[2] === 'wide' ? ' ap-field--wide' : '') + '"><label>' + esc(f[0]) + '</label>'
        + (f[2] === 'select' ? '<button type="button" class="ap-select ap-select--full"><span>' + esc(f[1]) + '</span>' + CHEV_S + '</button>'
          : f[2] === 'wide' ? '<textarea class="ap-input" rows="2">' + esc(f[1]) + '</textarea>' : '<input class="ap-input" value="' + esc(f[1]) + '">') + '</div>';
    };
    var steps = '<ol class="ap-steps">' + d.steps.map(function (st) { return '<li><b>' + esc(st[0]) + '</b><span>' + esc(st[1]) + '</span></li>'; }).join('') + '</ol>';
    return kpis(a.kpis)
      + panel('PM setup', 'Build a detailed PM that is easy to review and use', '<div class="ap-form">' + d.fields.map(field).join('') + '</div>',
          '<button type="button" class="ap-btn" data-ap-act="generate"><svg class="un-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>Generate detailed steps</button>')
      + panel('Steps', d.steps.length + ' steps · acceptance criteria included', steps);
  }
  appView.addEventListener('click', function (e) {
    var t = e.target.closest('.ap-tabs [role="tab"]');
    if (t) { [].forEach.call(t.parentNode.children, function (x) { x.setAttribute('aria-selected', String(x === t)); }); return; }
    var sw = e.target.closest('.ap-swatch');
    if (sw) { [].forEach.call(sw.parentNode.children, function (x) { x.classList.toggle('on', x === sw); }); return; }
    var act = e.target.closest('[data-ap-act]');
    if (act) { toast(act.getAttribute('data-ap-act') === 'print' ? 'Preparing the report to print…' : 'Detailed steps generated.'); return; }
    var b = e.target.closest('[data-ap]'); if (!b) return;
    if (b.getAttribute('data-ap') === 'menu') {   /* the app's ···: Favorite (on/off) and Edit */
      e.stopPropagation(); var fav = favApps.indexOf(openAppId) > -1;
      apMenu.innerHTML = '<button type="button" role="menuitem" data-act="fav">' + STAR + (fav ? 'Remove from favorites' : 'Add to favorites') + '</button>'
        + '<button type="button" role="menuitem" data-act="edit"><svg class="un-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg>Edit</button>';
      var r = b.getBoundingClientRect(); apMenu.style.left = Math.max(8, r.right - 200) + 'px'; apMenu.style.top = (r.bottom + 6) + 'px';
      requestAnimationFrame(function () { apMenu.classList.add('show'); });
      return;
    }
    appEl2.classList.remove('drawer-closed'); prompt.focus({ preventScroll: true });
  });
  var apMenu = document.createElement('div'); apMenu.className = 'un-menu ap-menu'; apMenu.setAttribute('role', 'menu'); apMenu.style.minWidth = '200px'; document.body.appendChild(apMenu);
  apMenu.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; apMenu.classList.remove('show');
    if (b.getAttribute('data-act') === 'fav') { toggleFav(openAppId); return; }
    editApp(openAppId);
  });
  /* Edit: the chat opens as a drawer on the right and the assistant checks it's the right app and what to change */
  function editApp(id) {
    if (openAppId !== id) openApp(id);
    var a = appById(id); appEl2.classList.remove('drawer-closed'); main.classList.add('chatting'); clearOpts();
    say('This is <strong>' + esc(a.name) + '</strong>. ' + esc(a.blurb) + ' Is this the app you need, or should I change something?', function () {
      choices([{ label: 'It’s what I need', act: 'app', val: 'ok' }, { label: 'Add a column', act: 'app', val: 'col' }, { label: 'Change the layout', act: 'app', val: 'layout' }]);
      prompt.placeholder = 'e.g. Group the rows by site…'; prompt.focus({ preventScroll: true });
    }, 600);
  }
  document.addEventListener('click', function (e) { if (!e.target.closest('.ap-menu') && !e.target.closest('[data-ap="menu"]')) apMenu.classList.remove('show'); });
  /* minimizing the drawer: the assistant (its 3D slot is moved, so the same robot keeps drawing) floats bottom-right */
  var botFab = document.getElementById('botFab'), heroSlot = document.querySelector('[data-robot="hero"]'), heroHome = document.querySelector('.assistant');
  var fabTimer = null;
  function syncFab() {
    var show = appEl2.classList.contains('app-mode') && appEl2.classList.contains('drawer-closed');
    if (!show) { clearTimeout(fabTimer); fabTimer = null; botFab.hidden = true; if (heroSlot.parentNode !== heroHome) heroHome.appendChild(heroSlot); return; }
    if (!botFab.hidden || fabTimer) return;
    /* right after the chat has slid out, the assistant pops up bottom-right: it jumps in, waves and says it's around */
    fabTimer = setTimeout(function () {
      fabTimer = null; if (!appEl2.classList.contains('drawer-closed')) return;
      botFab.appendChild(heroSlot); botFab.hidden = false;
      if (robots) { robots.hop('hero'); setTimeout(function () { robots.wave('hero'); }, 450); }
      var say = document.getElementById('fabSay'); say.classList.remove('show'); void say.offsetWidth;
      setTimeout(function () { say.classList.add('show'); }, 500);
      clearTimeout(say._t); say._t = setTimeout(function () { say.classList.remove('show'); }, 5500);
    }, 120);
  }
  new MutationObserver(syncFab).observe(appEl2, { attributes: true, attributeFilter: ['class'] });
  /* closing the chat: it slides out softly to the right, then the app takes the space */
  document.getElementById('drawerClose').addEventListener('click', function () {
    main.classList.add('drawer-out');
    setTimeout(function () { appEl2.classList.add('drawer-closed'); main.classList.remove('drawer-out'); }, 380);
  });
  botFab.addEventListener('click', function () { appEl2.classList.remove('drawer-closed'); if (robots) robots.wave('hero'); prompt.focus({ preventScroll: true }); });
  function openApp(id) {
    var a = appById(id); if (!a) return;
    openAppId = id; recentApps = [id].concat(recentApps.filter(function (x) { return x !== id; })).slice(0, 40); saveApps();
    [].forEach.call(document.querySelectorAll('#chatList .chat-item'), function (x) { x.classList.remove('live'); });
    document.getElementById('chatToggle').classList.remove('active'); appsToggle.classList.add('active');
    renderApps(); renderAppView();
    if (appsToggle.getAttribute('aria-expanded') !== 'true') toggleSection(appsToggle);   /* show where the open app lives */
    appEl2.classList.add('app-mode', 'drawer-closed');   /* opening shows just the app; Edit brings the chat in */
  }
  thread.addEventListener('click', function (e) {
    var c = e.target.closest('.opts [data-act="app"]'); if (!c) return;
    var v = c.getAttribute('data-val'), label = c.textContent; clearOpts(); addMsg('user', esc(label));
    if (v === 'ok') say('Great, it stays in your apps. Mark it as a favorite (☆) to keep it at the top.');
    else if (v === 'col') say('Sure, which column should I add? For example the cost of each stop, or the shift.', function () { prompt.placeholder = 'e.g. Add the cost of each stop…'; prompt.focus({ preventScroll: true }); });
    else say('Tell me how you’d like it laid out: a chart first, cards instead of a table, grouped by site…', function () { prompt.placeholder = 'e.g. Show a chart of downtime by asset first…'; prompt.focus({ preventScroll: true }); });
  });
  /* collapsed sidebar: hovering Chat or Apps shows its list floating to the right (pick from it without opening the sidebar) */
  var fly = document.createElement('div'), flyFor = null, flyTimer = null; fly.className = 'un-menu flyout'; fly.setAttribute('role', 'menu'); document.body.appendChild(fly);
  function flyItem(attr, val, label, active, icon) { return '<button type="button" role="menuitem" ' + attr + '="' + val + '"' + (active ? ' class="on"' : '') + '>' + (icon || '') + '<span>' + esc(label) + '</span></button>'; }
  function showFly(btn) {
    if (!appEl2.classList.contains('nav-closed') || matchMedia('(max-width: 860px)').matches) return;
    clearTimeout(flyTimer); flyFor = btn; var html;
    if (btn.id === 'appsToggle') {
      var rest = recentApps.filter(function (id) { return favApps.indexOf(id) === -1; });
      html = '<p class="fly-title">Apps</p>'
        + (favApps.length ? '<p class="list-label">Favorites</p>' + favApps.map(appById).filter(Boolean).map(function (a) { return flyItem('data-fly-app', a.id, a.name, a.id === openAppId); }).join('') : '')
        + (rest.length ? '<hr class="un-menu__sep">' + rest.map(appById).filter(Boolean).map(function (a) { return flyItem('data-fly-app', a.id, a.name, a.id === openAppId); }).join('') : '');
    } else {
      html = '<p class="fly-title">Chats</p>' + [].map.call(chatList.querySelectorAll('.chat-item'), function (c, i) { return flyItem('data-fly-chat', i, c.querySelector('span').textContent, c.classList.contains('live') && !openAppId); }).join('');
    }
    fly.innerHTML = html;
    var r = btn.getBoundingClientRect(); fly.style.left = (r.right + 14) + 'px'; fly.style.top = Math.max(8, Math.min(r.top - 6, innerHeight - fly.offsetHeight - 8)) + 'px';
    requestAnimationFrame(function () { fly.classList.add('show'); });
  }
  function hideFlySoon() { clearTimeout(flyTimer); flyTimer = setTimeout(function () { fly.classList.remove('show'); flyFor = null; }, 180); }
  ['appsToggle', 'chatToggle'].forEach(function (id) {
    var b = document.getElementById(id);
    b.addEventListener('mouseenter', function () { showFly(b); });
    b.addEventListener('mouseleave', hideFlySoon);
  });
  fly.addEventListener('mouseenter', function () { clearTimeout(flyTimer); });
  fly.addEventListener('mouseleave', hideFlySoon);
  fly.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; fly.classList.remove('show');
    if (b.hasAttribute('data-fly-app')) { openApp(b.getAttribute('data-fly-app')); return; }
    var c = chatList.querySelectorAll('.chat-item')[+b.getAttribute('data-fly-chat')]; if (c) c.click();
  });
  /* back to the chat: picking a conversation (or Chat) leaves the app */
  function closeApp() {
    if (!openAppId) return; openAppId = null; appEl2.classList.remove('app-mode', 'drawer-closed');
    appsToggle.classList.remove('active'); document.getElementById('chatToggle').classList.add('active'); renderApps();
  }
  document.getElementById('chatList').addEventListener('click', function (e) { if (e.target.closest('.chat-item') && !e.target.closest('.more')) closeApp(); });
  document.getElementById('chatToggle').addEventListener('click', closeApp);

  // CMS bridge: when the assistant creates something in the CMS, the banner shows it live, then goes back to "Back to CMS".
  var KINDS = {
    WO: { icon: '<path d="M9 4h6v3H9zM7 5.5H6a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6.5a1 1 0 0 0-1-1h-1M9 12h6M9 16h4"/>', href: '/work-orders', n: 1042 },
    PM: { icon: '<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M9 15l2 2 4-4"/>', href: '/predictive-maintenance', n: 217 }
  };
  var cms = document.getElementById('cms'), cmsTimers = [], cmsHome = cms.getAttribute('href');
  function cmsReset() { cms.classList.remove('busy', 'done'); cms.setAttribute('href', cmsHome); cms.setAttribute('aria-label', 'Back to CMS'); cms.querySelector('.alt').setAttribute('aria-hidden', 'true'); }
  function cmsCreated(type, label, href) {
    var k = KINDS[type] || KINDS.WO; cmsTimers.forEach(clearTimeout); cmsTimers = [];
    label = label || (type + '-' + (++k.n)); href = href || k.href;
    document.getElementById('cmsKind').innerHTML = k.icon; document.getElementById('cmsText').textContent = label + ' created';
    cms.classList.remove('done'); void cms.offsetWidth; cms.classList.add('busy');
    cms.setAttribute('href', href); cms.setAttribute('aria-label', label + ' created. Open it in the CMS'); cms.querySelector('.alt').removeAttribute('aria-hidden');
    cmsTimers.push(setTimeout(function () { cms.classList.add('done'); }, 1300));  /* spinner → check */
    cmsTimers.push(setTimeout(cmsReset, 5200));                                      /* back to the default banner */
    return label;
  }
  window.UltranovaCMS = { created: cmsCreated };

  // drawer on small screens
  function menu(open) { app.classList.toggle('menu-open', open); document.body.classList.toggle('menu-open', open); }
  document.getElementById('menuBtn').addEventListener('click', function () { menu(true); });
  document.getElementById('scrim').addEventListener('click', function () { menu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') menu(false); });
})();
